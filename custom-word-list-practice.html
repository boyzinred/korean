<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>

  <script>
    (() => {
      try {
        const saved = localStorage.getItem("koreanQuizThemeV2");
        const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Word List Practice</title>
  <style>

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme: light;
  --light-background: #28468A;
  --light-foreground: #F5F5F5;
  --light-primary: #BCE0E6;
  --light-primary-hover: #ADC6CB;
  --light-secondary: #AD8FE6;
  --light-secondary-soft: #8E7EBF;
  --light-accent: #C74E33;
  --light-accent-soft: #A24B36;
  --light-muted: #A0E090;
  --light-muted-strong: #99C588;
  --light-blue-soft: #6375CF;
  --light-border: #6674C8;
  --light-subtle: #DEEAAE;

  --background: var(--light-background);
  --foreground: var(--light-foreground);
  --primary: var(--light-primary);
  --primary-hover: var(--light-primary-hover);
  --secondary: var(--light-secondary);
  --secondary-soft: var(--light-secondary-soft);
  --accent: var(--light-accent);
  --accent-soft: var(--light-accent-soft);
  --muted: var(--light-muted);
  --muted-strong: var(--light-muted-strong);
  --blue-soft: var(--light-blue-soft);
  --border: var(--light-border);
  --subtle: var(--light-subtle);

  --surface: #F5F5F5;
  --surface-text: #28468A;
  --surface-muted: #E8ECF4;
  --inverse: #20386E;
  --inverse-text: #F5F5F5;
  --hero-heading: #FFFFFF;
  --hero-text: #EFF6FF;
  --radius-md: 6px;
  --radius-lg: 8px;
  --font: 'Outfit', system-ui, sans-serif;
  --transition: all 200ms ease;
}

html[data-theme='dark'] {
  color-scheme: dark;
  --light-background: #111827;
  --light-foreground: #F9FAFB;
  --light-primary: #6CC2D0;
  --light-primary-hover: #6CC0D0;
  --light-secondary: #8B61DC;
  --light-secondary-soft: #201933;
  --light-accent: #E29D8D;
  --light-accent-soft: #391B13;
  --light-muted: #1F2937;
  --light-muted-strong: #374151;
  --light-blue-soft: #12193B;
  --light-border: #374151;
  --light-subtle: #CBD5E1;

  --background: var(--light-background);
  --foreground: var(--light-foreground);
  --primary: var(--light-primary);
  --primary-hover: var(--light-primary-hover);
  --secondary: var(--light-secondary);
  --secondary-soft: var(--light-secondary-soft);
  --accent: var(--light-accent);
  --accent-soft: var(--light-accent-soft);
  --muted: var(--light-muted);
  --muted-strong: var(--light-muted-strong);
  --blue-soft: var(--light-blue-soft);
  --border: var(--light-border);
  --subtle: var(--light-subtle);

  --surface: #1F2937;
  --surface-text: #F9FAFB;
  --surface-muted: #111827;
  --inverse: #0F172A;
  --inverse-text: #F9FAFB;
}

* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  /* Base text 6pt larger than the browser default (16px -> 24px).
     Every size on the page is in rem, so this scales the whole layout. */
  font-size: calc(100% + 6pt);
}
body {
  margin: 0;
  min-height: 100vh;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font);
  line-height: 1.6;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.site-header {
  color: var(--surface-text);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.header-inner,
.page-main {
  width: min(1120px, calc(100% - 40px));
  margin-inline: auto;
}
.header-inner {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand {
  min-width: 0;
  overflow: hidden;
  color: var(--surface-text);
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -.02em;
  text-overflow: ellipsis;
  text-decoration: none;
  white-space: nowrap;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-link {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 13px;
  color: var(--surface-text);
  background: var(--surface-muted);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  font-weight: 700;
  text-decoration: none;
}
.header-link:hover {
  border-color: var(--primary);
  background: var(--blue-soft);
  color: var(--foreground);
}
.page-main {
  margin-top: 24px;
  margin-bottom: 72px;
  overflow: hidden;
  color: var(--surface-text);
  background: var(--surface);
  border-radius: var(--radius-lg);
}
.hero {
  color: var(--hero-heading);
  background: var(--background);
}
.hero-inner {
  padding: clamp(48px, 7vw, 82px);
}
.hero-kicker {
  margin: 0 0 18px;
  color: var(--primary);
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.hero h1 {
  max-width: 14ch;
  margin: 0;
  font-size: clamp(3rem, 7vw, 5.7rem);
  font-weight: 800;
  line-height: .92;
  letter-spacing: -.02em;
}
.hero p {
  max-width: 62ch;
  margin: 24px 0 0;
  color: var(--hero-text);
  font-size: 1.05rem;
}
.toc-card {
  padding: 18px 22px;
  color: var(--surface-text);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.toc-label {
  display: block;
  margin-bottom: 10px;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.toc-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.toc-link {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 12px;
  color: var(--surface-text);
  background: var(--surface-muted);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  font-size: .88rem;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
}
.toc-link:hover {
  color: var(--foreground);
  background: var(--blue-soft);
  border-color: var(--primary);
}
.toc-link small,
.toc-link span:last-child:not(:first-child) {
  font-size: .72rem;
  opacity: .78;
}
.section,
.block,
.quiz-section {
  scroll-margin-top: 18px;
  border-bottom: 1px solid var(--border);
}
.section-header,
details.section > summary,
details.block > summary,
details.quiz-section > summary {
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: clamp(30px, 5vw, 64px);
  color: #192B5D;
  background: var(--secondary);
}
.section-header h2,
details.section > summary,
details.block > summary,
details.quiz-section > summary {
  font-size: clamp(2.2rem, 5vw, 4.8rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.02em;
}
details.section > summary,
details.block > summary,
details.quiz-section > summary {
  cursor: pointer;
  list-style: none;
}
details.section > summary::-webkit-details-marker,
details.block > summary::-webkit-details-marker,
details.quiz-section > summary::-webkit-details-marker { display: none; }
details.section > summary::after,
details.block > summary::after,
details.quiz-section > summary::after {
  content: "Collapse";
  min-height: 56px;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  color: #192B5D;
  background: #FFFFFF;
  border: 4px solid #192B5D;
  border-radius: var(--radius-md);
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
details.section:not([open]) > summary::after,
details.block:not([open]) > summary::after,
details.quiz-section:not([open]) > summary::after { content: "Expand"; }
.section-content,
.section-body,
.block-inner,
.quiz-body {
  padding: clamp(26px, 5vw, 64px);
  color: var(--surface-text);
  background: var(--surface);
}
.rule-card,
.info-card,
.guide-card,
.note-card,
.grammar-card,
.control-card {
  padding: 22px;
  color: var(--surface-text);
  background: var(--blue-soft);
  border-radius: var(--radius-lg);
}
html[data-theme="light"] .rule-card,
html[data-theme="light"] .info-card,
html[data-theme="light"] .guide-card,
html[data-theme="light"] .note-card,
html[data-theme="light"] .grammar-card,
html[data-theme="light"] .control-card {
  color: #F5F5F5;
}
.exercise,
.quiz-card {
  overflow: hidden;
  color: var(--surface-text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.exercise-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(158px, auto);
  color: var(--inverse-text);
  background: var(--inverse);
}
.exercise-head-copy {
  padding: 24px 28px;
}
.exercise-kicker,
.prompt-label,
.control-label {
  color: var(--primary);
  font-size: .74rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.exercise-head h3 {
  margin: 7px 0 0;
  font-size: clamp(1.45rem, 3vw, 2.3rem);
  line-height: 1;
  letter-spacing: -.02em;
}
.exercise-head p {
  margin: 10px 0 0;
  color: var(--subtle);
}
.score {
  min-width: 158px;
  display: grid;
  place-items: center;
  padding: 20px;
  color: #192B5D;
  background: var(--accent);
  font-size: .9rem;
  font-weight: 800;
}
.exercise-body {
  padding: clamp(24px, 4vw, 38px);
}
.progress {
  height: 12px;
  overflow: hidden;
  background: var(--muted-strong);
  border-radius: 0;
}
.progress > div,
.progress-fill {
  height: 100%;
  background: var(--secondary);
}
input,
select,
textarea,
.answer-input {
  width: 100%;
  min-height: 56px;
  padding: 0 14px;
  color: var(--surface-text);
  background: var(--surface-muted);
  border: 2px solid transparent;
  border-radius: var(--radius-md);
}
input:focus,
select:focus,
textarea:focus,
.answer-input:focus {
  background: var(--surface);
  border-color: var(--primary);
}
input:disabled,
select:disabled,
textarea:disabled,
.answer-input:disabled {
  color: var(--subtle);
  background: var(--muted-strong);
  cursor: not-allowed;
  opacity: 1;
}
.btn,
.primary-btn,
.secondary-btn,
.restart-top-btn,
.mode-btn,
.choice,
.blur-toggle {
  min-height: 56px;
  padding: 0 18px;
  border: 0;
  border-radius: var(--radius-md);
  font-weight: 800;
  transition: var(--transition);
}
.btn:hover:not(:disabled),
.primary-btn:hover:not(:disabled),
.secondary-btn:hover:not(:disabled),
.mode-btn:hover:not(:disabled),
.choice:hover:not(:disabled),
.blur-toggle:hover:not(:disabled) {
  transform: scale(1.04);
}
.primary-btn,
.btn.primary {
  color: #192B5D;
  background: var(--primary);
}
.primary-btn:hover:not(:disabled),
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); }
.secondary-btn,
.btn.positive {
  color: #192B5D;
  background: var(--secondary);
}
.btn.warning { color: #192B5D; background: var(--accent); }
.btn.secondary,
.restart-top-btn,
.mode-btn,
.blur-toggle {
  color: var(--surface-text);
  background: var(--surface-muted);
}
.mode-btn.active,
.blur-toggle[aria-pressed="true"] {
  color: #192B5D;
  background: var(--primary);
}
.choice {
  width: 100%;
  min-height: 58px;
  text-align: left;
  color: var(--surface-text);
  background: var(--surface-muted);
}
.choice:hover:not(:disabled) {
  color: #192B5D;
  background: var(--primary);
}
.choice.correct {
  color: #FFFFFF;
  background: var(--secondary);
}
.choice.wrong {
  color: #FFFFFF;
  background: var(--accent);
}
.feedback {
  display: none;
  margin-top: 16px;
  padding: 18px;
  border-radius: var(--radius-lg);
}
.feedback.good {
  display: block;
  background: var(--secondary-soft);
  border-left: 8px solid var(--secondary);
}
.feedback.bad {
  display: block;
  background: var(--accent-soft);
  border-left: 8px solid var(--accent);
}
html[data-theme="light"] .feedback { color: #FFFFFF; }
.utility-controls {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  display: flex;
  gap: 10px;
}
.utility-button {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  padding: 0;
  color: #192B5D;
  background: var(--primary);
  border: 0;
  border-radius: 50%;
  font-size: 1.1rem;
  font-weight: 800;
  text-decoration: none;
  transition: var(--transition);
}
.utility-button:hover {
  background: var(--primary-hover);
  transform: scale(1.05);
}
.utility-button.top { background: var(--accent); }

.hidden { display: none !important; }

@media (max-width: 900px) {
  .exercise-head { grid-template-columns: 1fr; }
  .score { min-height: 74px; }
}
@media (max-width: 680px) {
  .header-inner { min-height: 60px; }
  .header-inner,
  .page-main { width: 100%; }
  .header-inner { padding: 0 14px; }
  .page-main {
    margin-top: 0;
    border-radius: 0;
  }
  .hero-inner { padding: 48px 22px; }
  .hero h1 { font-size: clamp(2.8rem, 14vw, 4.5rem); }
  .toc-card {
    padding: 18px 22px;
    overflow-x: auto;
  }
  .toc-grid {
    width: max-content;
    flex-wrap: nowrap;
  }
  .section-header,
  details.section > summary,
  details.block > summary,
  details.quiz-section > summary {
    min-height: 0;
    align-items: stretch;
    flex-direction: column;
    padding: 30px 22px;
  }
  details.section > summary::after,
  details.block > summary::after,
  details.quiz-section > summary::after {
    width: 100%;
  }
  .section-content,
  .section-body,
  .block-inner,
  .quiz-body,
  .exercise-body { padding: 22px; }
  .btn,
  .primary-btn,
  .secondary-btn,
  .restart-top-btn,
  .mode-btn,
  .choice,
  .blur-toggle { width: 100%; }
  .utility-controls { right: 10px; bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
    transform: none !important;
  }
}

#reference > summary { color: #FFFFFF; background: var(--accent); }
#exerciseSections > details:nth-child(3n+1) > summary { background: var(--secondary); }
#exerciseSections > details:nth-child(3n+2) > summary { color: #FFFFFF; background: var(--accent); }
#exerciseSections > details:nth-child(3n+3) > summary { background: var(--primary); }

.guide-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 18px;
}
.guide-card h3,
.note-card h3 {
  margin: 0 0 10px;
}
.guide-card p,
.note-card p { margin: 0 0 10px; }
.mini-list {
  display: grid;
  gap: 8px;
}
.ref-section {
  margin-top: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.ref-section > summary {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 16px 20px;
  color: var(--inverse-text);
  background: var(--inverse);
  cursor: pointer;
  list-style: none;
  font-weight: 800;
}
.ref-section > summary::-webkit-details-marker { display: none; }
.ref-section > summary .small { color: var(--subtle); }
.small {
  display: block;
  color: inherit;
  font-size: .78rem;
  opacity: .78;
}
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  min-width: 700px;
  border-collapse: collapse;
  color: var(--surface-text);
  background: var(--surface);
}
th,
td {
  padding: 14px 16px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--border);
}
th {
  color: #192B5D;
  background: var(--muted);
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.roman {
  color: var(--primary);
  font-weight: 800;
}
.hangul {
  font-size: 1.15rem;
  font-weight: 800;
}
.vocab-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 16px;
  color: var(--surface-text);
  background: var(--surface-muted);
  border-bottom: 1px solid var(--border);
}
.vocab-tools__label {
  margin-right: auto;
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.blur-toggle { min-height: 42px; }
.blur-target {
  display: inline-block;
  transition: filter 180ms ease, opacity 180ms ease;
}
.ref-section.blur-meaning [data-vocab-field="meaning"] .blur-target,
.ref-section.blur-romanization [data-vocab-field="romanization"] .blur-target,
.ref-section.blur-korean [data-vocab-field="korean"] .blur-target {
  filter: blur(6px);
  opacity: .72;
  user-select: none;
}
.ref-section.blur-meaning [data-vocab-field="meaning"].peek .blur-target,
.ref-section.blur-romanization [data-vocab-field="romanization"].peek .blur-target,
.ref-section.blur-korean [data-vocab-field="korean"].peek .blur-target {
  filter: none;
  opacity: 1;
  user-select: text;
}
[data-vocab-field] { cursor: pointer; }
[data-vocab-field]:focus-visible {
  outline: 3px solid var(--primary);
  outline-offset: -4px;
}
/* Part-of-speech group headers and per-word usage notes */
.pos-korean {
  margin-left: 8px;
  font-size: .82rem;
  font-weight: 700;
  opacity: .85;
}
.pos-note {
  margin: 0;
  padding: 12px 18px;
  font-size: .86rem;
  font-weight: 600;
  color: var(--surface-text);
  background: var(--surface-muted);
  border-bottom: 1px solid var(--border);
}
.word-note-head { width: 3.5rem; }
.word-note-cell {
  width: 3.5rem;
  padding-right: 0;
  vertical-align: middle;
}
.word-note-toggle {
  width: 2.125rem;
  height: 2.125rem;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--surface);
  background: var(--accent);
  border: 0;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
}
.word-note-toggle:hover { opacity: .85; }
.word-note-row > td { padding: 0 1rem 1rem; }
.word-note {
  display: grid;
  gap: .75rem;
  padding: .875rem 1rem;
  color: var(--surface-text);
  background: var(--surface-muted);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
}
.word-note-usage {
  margin: 0;
  font-size: .92rem;
  font-weight: 600;
}
.word-note-example {
  display: grid;
  gap: .25rem;
  padding: .75rem .875rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
.word-note-example p { margin: 0; }
.word-note-label {
  font-size: .68rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  opacity: .7;
}
.word-note-ko {
  font-size: 1.05rem;
  font-weight: 800;
}
.word-note-en { font-weight: 700; }
.word-note-form {
  font-size: .84rem;
  font-weight: 600;
  opacity: .85;
}
.familiarity-cell { min-width: 11.875rem; }
.familiarity-stars {
  display: inline-flex;
  gap: .1875rem;
  padding: .25rem;
  background: var(--surface-muted);
  border-radius: var(--radius-md);
}
.familiarity-star {
  width: 2.375rem;
  height: 2.375rem;
  display: grid;
  place-items: center;
  padding: 0;
  color: var(--border);
  background: transparent;
  border: 0;
  border-radius: .25rem;
  font-size: 1.35rem;

<body id="top">
  <header class="site-header">

  <main class="page-main">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-inner">
        <span class="hero-kicker">Helper exercise</span>
        <h1 id="page-title">Paste Your Own List</h1>
        <p>Drill any word list you already have. Words that appear in the TOPIK II word bank keep their meaning and romanization; everything else is read straight off the line you pasted.</p>
        <div class="stat-strip" id="statStrip"></div>
      </div>

    <div id="exerciseSections"></div>
  </main>

  <div class="utility-controls" aria-label="Page utilities">
    <button class="utility-button" type="button" data-theme-toggle aria-pressed="false"><span data-theme-icon aria-hidden="true">&#9790;</span><span class="sr-only">Toggle color theme</span></button>
    <a class="utility-button top" href="#top" aria-label="Back to top">&uarr;</a>
  </div>

  <script src="./shared-vocab/topik-vocab-1500.js?v=1.0.0"></script>
  <script>
  (() => {
    "use strict";

    // Strict character-by-character transliteration using the supplied system.
    // Initial/final pairs: ㄱ g/k, ㄷ d/t, ㄹ r/l, ㅂ b/p.
    // Syllable dashes are display-only; answer checking removes them.
    function romanizeKorean(text) {
      const CHO = ["g", "gg", "n", "d", "dd", "r", "m", "b", "bb", "s", "ss", "", "j", "jj", "ch", "k", "t", "p", "h"];
      const JUNG = ["a", "ae", "ya", "yae", "eo", "e", "yeo", "ye", "o", "oa", "oae", "oi", "yo", "u", "ueo", "ue", "ui", "yu", "eu", "eui", "i"];
      const JONG = ["", "k", "kk", "ks", "n", "nj", "nh", "t", "l", "lk", "lm", "lp", "ls", "lt", "lp", "lh", "m", "p", "ps", "s", "ss", "ng", "j", "ch", "k", "t", "p", "h"];

      return String(text ?? "").split(" ").map(word => {
        const parts = [];
        let currentSyllables = [];

        for (let i = 0; i < word.length; i++) {
          const charCode = word.charCodeAt(i);
          if (charCode >= 0xAC00 && charCode <= 0xD7A3) {
            const offset = charCode - 0xAC00;
            const jongIndex = offset % 28;
            const jungIndex = Math.floor(offset / 28) % 21;
            const choIndex = Math.floor(offset / (28 * 21));
            currentSyllables.push(CHO[choIndex] + JUNG[jungIndex] + JONG[jongIndex]);
          } else {
            if (currentSyllables.length) {
              parts.push(currentSyllables.join("-"));
              currentSyllables = [];
            }
            parts.push(word[i]);
          }
        }

        if (currentSyllables.length) parts.push(currentSyllables.join("-"));
        return parts.join("");
      }).join(" ");
    }
    // ------------------------------------------------------------------ bank
    // The TOPIK II word bank is loaded so a pasted list that uses words from it
    // keeps their meaning and id; anything else becomes a one-off custom word.
    const RAW = (window.TopikVocab && window.TopikVocab.WORDS) || [];
    const idSeen = new Map();
    const BANK = RAW.map(word => {
      const base = `${word.korean}:${word.partOfSpeech}`;
      const n = (idSeen.get(base) || 0) + 1;
      idSeen.set(base, n);
      return Object.assign({}, word, {
        id: n === 1 ? base : `${base}:${n}`,
        romanization: romanizeKorean(word.korean),
        romanization_alts: (word.korean_alts || []).map(romanizeKorean)
      });
    });

    const BANK_BY_KOREAN = new Map();
    BANK.forEach(word => {
      if (!BANK_BY_KOREAN.has(word.korean)) BANK_BY_KOREAN.set(word.korean, []);
      BANK_BY_KOREAN.get(word.korean).push(word);
    });

    // -------------------------------------------------------------- helpers
    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeRomanization(text) {
      return String(text ?? "")
        .trim()
        .toLowerCase()
        .replace(/[’']/g, "")
        .replace(/[^a-z]/g, ""); // Spaces and dashes naturally stripped for checking
    }

    function normalizeEnglish(text) {
      return String(text ?? "")
        .trim()
        .toLowerCase()
        .replace(/[’']/g, "")
        .replace(/&/g, "and")
        .replace(/\ba\.?m\.?\b/g, "am")
        .replace(/\bp\.?m\.?\b/g, "pm")
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeKorean(text) {
      return String(text ?? "").replace(/\s+/g, "").trim();
    }

    // "to be excellent, outstanding" accepts the whole gloss or any one piece,
    // so a word with several English meanings is not scored on word order.
    function splitMeaning(meaning) {
      const exact = String(meaning);
      const pieces = exact
        .split("/")
        .flatMap(part => part.split(","))
        .map(s => s.trim())
        .filter(Boolean);
      return [...new Set([exact, ...pieces])];
    }

    const MODES = [
      { key: "english", label: "English" },
      { key: "romanization", label: "Romanization" },
      { key: "korean", label: "Korean" }
    ];

    function displayValue(item, mode) {
      if (mode === "english") return item.meaning;
      if (mode === "romanization") return item.romanization;
      return item.korean;
    }

    function answerValues(item, mode) {
      if (mode === "english") return splitMeaning(item.meaning);
      if (mode === "romanization") return [...new Set([item.romanization, ...(item.romanization_alts || [])])];
      return [...new Set([item.korean, ...(item.korean_alts || [])])];
    }

    function normalizeByMode(value, mode) {
      if (mode === "english") return normalizeEnglish(value);
      if (mode === "romanization") return normalizeRomanization(value);
      return normalizeKorean(value);
    }

    // Homographs share a prompt (이 is a numeral, a determiner and a particle),
    // so every word showing the same prompt contributes an accepted answer.
    function acceptedAnswers(pool, item, qMode, aMode) {
      const promptValue = normalizeByMode(displayValue(item, qMode), qMode);
      const matching = pool.filter(other => normalizeByMode(displayValue(other, qMode), qMode) === promptValue);
      return [...new Set((matching.length ? matching : [item]).flatMap(other => answerValues(other, aMode)))];
    }

    function isCorrect(pool, item, qMode, aMode, userText) {
      const normalizedUser = normalizeByMode(userText, aMode);
      if (!normalizedUser) return false;
      return acceptedAnswers(pool, item, qMode, aMode)
        .some(ans => normalizeByMode(ans, aMode) === normalizedUser);
    }

    function itemAnswerDisplay(item, mode) {
      const values = answerValues(item, mode);
      return mode === "english" ? item.meaning : values[0];
    }

    function fullEntry(item) {
      return `${item.meaning} / ${item.romanization} / ${item.korean}`;
    }

    function modeLabel(mode) {
      return MODES.find(m => m.key === mode)?.label || mode;
    }

    // Every way a question can look like the one before it: the same word, the
    // same prompt on screen (이 is a numeral, a determiner and a particle), or
    // the same expected answer.
    function questionKeys(item, qMode, aMode) {
      return [
        `w:${normalizeKorean(item.korean)}`,
        `q:${normalizeByMode(displayValue(item, qMode), qMode)}`,
        `a:${normalizeByMode(itemAnswerDisplay(item, aMode), aMode)}`
      ];
    }

    // Deals the pool out in a random order that keeps look-alike questions
    // apart — a repeat from the multiplier, a second bank entry for the same
    // word, or two words that share a prompt or an answer.
    function spacedOrder(items, keysOf) {
      const buckets = new Map();
      items.forEach(item => {
        const keys = keysOf(item);
        const id = keys[0];
        if (!buckets.has(id)) buckets.set(id, { keys, items: [] });
        buckets.get(id).items.push(item);
      });
      let ids = shuffle([...buckets.keys()]);
      const maxGap = Math.max(0, Math.min(ids.length - 1, 4));
      const out = [], recent = [];
      while (out.length < items.length) {
        let picked = null;
        // Widest gap first, then relax it until something is dealable; gap 0
        // has no window, so the loop always finds a pick.
        for (let gap = maxGap; gap >= 0 && picked === null; gap--) {
          const blocked = new Set(gap > 0 ? recent.slice(-gap).flat() : []);
          const available = ids.filter(id => !buckets.get(id).keys.some(key => blocked.has(key)));
          if (!available.length) continue;
          const most = Math.max(...available.map(id => buckets.get(id).items.length));
          const best = available.filter(id => buckets.get(id).items.length === most);
          picked = best[Math.floor(Math.random() * best.length)];
        }
        if (picked === null) break;
        const bucket = buckets.get(picked);
        out.push(bucket.items.shift());
        recent.push(bucket.keys);
        // Emptied buckets drop out, so the search stays fast on a 1500-word run.
        if (!bucket.items.length) ids = ids.filter(id => id !== picked);
      }
      return out;
    }

    function shuffle(list) {
      const out = [...list];
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    // ------------------------------------------------------------ exercises
    // One exercise on this page, so the runner machinery below still works
    // unchanged: it drives whatever is in this list.
    const EXERCISES = [
      {
        id: "custom",
        kicker: "Practice",
        title: "Paste Your Own List",
        blurb: "Paste a word list from anywhere — a missed-words export from a vocabulary page, a page of your notes, a column out of a spreadsheet — then tell the page how to read it: which character separates the columns, and what each column holds. Bullets, numbering, and lines starting with # are ignored, so a missed-words export pastes in as-is.",
        picker: () => `
          <div class="picker">
            <div class="picker-head">
              <span class="control-label">Your word list</span>
              <div class="picker-actions">
                <button class="btn secondary" type="button" id="custom-clear">Clear</button>
              </div>
            </div>
            <textarea class="paste-box" id="custom-input" spellcheck="false" placeholder="to be absurd, preposterous / hoang-dang-ha-da / 황당하다&#10;to steal / hum-chi-da / 훔치다&#10;ventilation / 환기"></textarea>
          </div>
          <div class="picker">
            <span class="control-label">How to read the columns</span>
            <div class="exercise-menu-grid">
              <label>Column separator<select id="custom-sep">
                ${SEPARATORS.map(sep => `<option value="${esc(sep.key)}">${esc(sep.label)}</option>`).join("")}
              </select></label>
              <label>Other separator<small class="menu-count-note">Used when the separator is set to Other</small><input id="custom-sep-other" type="text" maxlength="4" value="" placeholder="e.g. =" disabled></label>
              ${[1, 2, 3].map(n => `
                <label>Column ${n}<select id="custom-col${n}" disabled>
                  ${COLUMN_FIELDS.map(field => `<option value="${esc(field.key)}"${field.key === CUSTOM_DEFAULT_COLUMNS[n - 1] ? " selected" : ""}>${esc(field.label)}</option>`).join("")}
                </select></label>`).join("")}
            </div>
            <div class="menu-summary" id="custom-preview"></div>
          </div>`,
        select: () => parsedCustom().words,
        emptyMessage: "Paste at least one line containing a Korean word.",
        onRender: () => {
          const input = document.getElementById("custom-input");
          input.addEventListener("input", () => refreshCount("custom"));
          document.getElementById("custom-clear").addEventListener("click", () => {
            input.value = "";
            refreshCount("custom");
          });
          // Auto-detect reads the columns itself, so the mapping controls only
          // come alive once a separator is chosen by hand.
          const separator = document.getElementById("custom-sep");
          const syncMappingControls = () => {
            const manual = separator.value !== "auto";
            [1, 2, 3].forEach(n => { document.getElementById(`custom-col${n}`).disabled = !manual; });
            document.getElementById("custom-sep-other").disabled = separator.value !== "other";
          };
          separator.addEventListener("change", syncMappingControls);
          syncMappingControls();
        },
        beforeCount: () => renderCustomPreview(),
        countNote: () => {
          const parsed = parsedCustom();
          const notes = [];
          if (parsed.skipped.length) notes.push(`${parsed.skipped.length} line${parsed.skipped.length === 1 ? "" : "s"} skipped`);
          if (parsed.romanMismatches) notes.push(`${parsed.romanMismatches} pasted romanization${parsed.romanMismatches === 1 ? "" : "s"} replaced`);
          return notes.length ? ` · ${notes.join(" · ")}` : "";
        }
      }
    ];

    // ------------------------------------------------------- custom list parsing
    const HANGUL = /[가-힣]/;

    const SEPARATORS = [
      { key: "auto", label: "Auto-detect", value: null },
      { key: "slash", label: "Slash  /", value: "/" },
      { key: "comma", label: "Comma  ,", value: "," },
      { key: "tab", label: "Tab", value: "\t" },
      { key: "pipe", label: "Pipe  |", value: "|" },
      { key: "semicolon", label: "Semicolon  ;", value: ";" },
      { key: "colon", label: "Colon  :", value: ":" },
      { key: "dash", label: "Dash  -", value: "-" },
      { key: "equals", label: "Equals  =", value: "=" },
      { key: "other", label: "Other…", value: null }
    ];
    const SEPARATOR_BY_KEY = new Map(SEPARATORS.map(sep => [sep.key, sep]));

    const COLUMN_FIELDS = [
      { key: "english", label: "English" },
      { key: "romanization", label: "Romanization" },
      { key: "korean", label: "Korean" },
      { key: "ignore", label: "Ignore this column" },
      { key: "none", label: "Not present" }
    ];
    const CUSTOM_DEFAULT_COLUMNS = ["english", "romanization", "korean"];

    function customOptions() {
      const separatorSelect = document.getElementById("custom-sep");
      if (!separatorSelect) return { mode: "auto", separator: null, columns: [] };
      const key = separatorSelect.value;
      if (key === "auto") return { mode: "auto", separator: null, columns: [] };
      const separator = key === "other"
        ? (document.getElementById("custom-sep-other").value || "")
        : SEPARATOR_BY_KEY.get(key).value;
      const columns = [1, 2, 3].map(n => document.getElementById(`custom-col${n}`).value);
      return { mode: "manual", separator, columns };
    }

    // Parsing runs on every keystroke and on every count refresh, so the
    // result is memoised against the text and the column settings.
    let customCache = { key: null, value: null };
    function parsedCustom() {
      const input = document.getElementById("custom-input");
      if (!input) return { words: [], skipped: [], romanMismatches: 0, error: "" };
      const options = customOptions();
      const key = JSON.stringify([input.value, options]);
      if (customCache.key !== key) customCache = { key, value: parseCustom(input.value, options) };
      return customCache.value;
    }

    // Strips list markup a pasted line may carry. Returns "" for lines that
    // are structure rather than content.
    function cleanLine(raw) {
      let line = raw.trim();
      if (!line) return "";
      if (/^(#|>|<!--|```)/.test(line)) return "";
      return line.replace(/^[-*+]\s+/, "").replace(/^\d+[.)]\s+/, "").replace(/^[`*_]+|[`*_]+$/g, "").trim();
    }

    // Auto-detect reads fields from the right — korean last, then romanization
    // if it matches what the romanizer produces — because an English gloss may
    // itself contain a slash ("snow / eye").
    function autoFields(line) {
      const parts = line.split("/").map(part => part.trim());
      const korean = parts[parts.length - 1];
      let rest = parts.slice(0, -1);
      if (rest.length >= 2 && normalizeRomanization(rest[rest.length - 1]) === normalizeRomanization(romanizeKorean(korean))) {
        rest = rest.slice(0, -1);
      }
      return { korean, meaning: rest.join(" / ").trim(), romanization: "" };
    }

    // Manual mode maps columns positionally. Only English can hold the
    // separator character, so any extra columns are folded back into it.
    function mappedFields(line, options) {
      const active = options.columns.filter(column => column !== "none");
      const parts = line.split(options.separator).map(part => part.trim());
      if (parts.length < active.length) {
        return { error: `expected ${active.length} columns, found ${parts.length}` };
      }
      const fields = { korean: "", meaning: "", romanization: "" };
      const extra = parts.length - active.length;
      const englishAt = active.indexOf("english");
      if (extra > 0 && englishAt === -1) {
        return { error: `expected ${active.length} columns, found ${parts.length}` };
      }
      active.forEach((column, i) => {
        let value;
        if (extra <= 0 || i < englishAt) value = parts[i];
        else if (i === englishAt) value = parts.slice(i, i + 1 + extra).join(`${options.separator} `).trim();
        else value = parts[i + extra];
        if (column === "english") fields.meaning = value;
        else if (column === "korean") fields.korean = value;
        else if (column === "romanization") fields.romanization = value;
      });
      return fields;
    }

    function mappingError(options) {
      if (options.mode !== "manual") return "";
      if (!options.separator) return "Type the character that separates your columns.";
      const active = options.columns.filter(column => column !== "none");
      if (!active.length) return "Set at least one column.";
      const koreanCount = active.filter(column => column === "korean").length;
      if (koreanCount === 0) return "One column has to be Korean — that is the word being practised.";
      if (koreanCount > 1) return "Only one column can be Korean.";
      if (active.filter(column => column === "english").length > 1) return "Only one column can be English.";
      if (active.filter(column => column === "romanization").length > 1) return "Only one column can be Romanization.";
      return "";
    }

    function parseCustom(text, options) {
      const opts = options || { mode: "auto", separator: null, columns: [] };
      const error = mappingError(opts);
      if (error) return { words: [], skipped: [], romanMismatches: 0, error };

      const words = [], skipped = [], seen = new Set();
      let romanMismatches = 0;

      String(text || "").split(/\r?\n/).forEach((raw, index) => {
        const line = cleanLine(raw);
        if (!line) return;
        const skip = why => skipped.push({ line: index + 1, text: raw, why });

        if (opts.mode === "auto" && !HANGUL.test(line)) { skip("no Korean on the line"); return; }

        const fields = opts.mode === "manual" ? mappedFields(line, opts) : autoFields(line);
        if (fields.error) { skip(fields.error); return; }

        const korean = fields.korean;
        if (!korean || !HANGUL.test(korean)) { skip("the Korean column has no Hangul"); return; }
        const meaning = fields.meaning;

        // The generated romanization always wins, so a pasted one that follows
        // a different system does not turn into a wrong answer.
        if (fields.romanization && normalizeRomanization(fields.romanization) !== normalizeRomanization(romanizeKorean(korean))) {
          romanMismatches++;
        }

        // A word already in the bank keeps its id, part of speech and day, so
        // a pasted review list still feeds the missed-word pool.
        const known = BANK_BY_KOREAN.get(korean) || [];
        let item = null;
        if (known.length === 1) item = known[0];
        else if (known.length > 1) {
          item = known.find(candidate => normalizeEnglish(candidate.meaning) === normalizeEnglish(meaning))
            || known.find(candidate => meaning && normalizeEnglish(candidate.meaning).includes(normalizeEnglish(meaning)))
            || known[0];
        }
        if (!item) {
          if (!meaning) { skip("no English meaning, and the word is not in the bank"); return; }
          item = {
            id: `custom:${korean}`,
            korean,
            meaning,
            romanization: romanizeKorean(korean),
            romanization_alts: [],
            partOfSpeech: "",
            topic: "",
            level: 0,
            day: 0,
            custom: true
          };
        }
        if (seen.has(item.id)) return;
        seen.add(item.id);
        words.push(item);
      });
      return { words, skipped, romanMismatches, error: "" };
    }

    // Shows how the current settings actually read the pasted text, so a wrong
    // separator or column order is obvious before the exercise starts.
    function renderCustomPreview() {
      const target = document.getElementById("custom-preview");
      if (!target) return;
      const parsed = parsedCustom();

      if (parsed.error) {
        target.classList.add("empty");
        target.textContent = parsed.error;
        return;
      }
      if (!parsed.words.length) {
        target.classList.add("empty");
        target.textContent = parsed.skipped.length
          ? `No usable lines. First problem — line ${parsed.skipped[0].line}: ${parsed.skipped[0].why}`
          : "Paste a list above to see how it will be read.";
        return;
      }

      target.classList.remove("empty");
      const rows = parsed.words.slice(0, 3).map(word =>
        `<div class="preview-row"><span>${esc(word.meaning)}</span><span class="roman">${esc(word.romanization)}</span><span class="hangul">${esc(word.korean)}</span></div>`).join("");
      const problems = parsed.skipped.slice(0, 2)
        .map(entry => `<div class="preview-problem">Line ${entry.line} skipped — ${esc(entry.why)}: <code>${esc(entry.text.trim().slice(0, 60))}</code></div>`).join("");
      target.innerHTML = `
        <div class="preview-label">Reading the first ${Math.min(3, parsed.words.length)} of ${parsed.words.length} words as</div>
        ${rows}
        ${problems}
        ${parsed.skipped.length > 2 ? `<div class="preview-problem">…and ${parsed.skipped.length - 2} more skipped lines</div>` : ""}
        ${parsed.romanMismatches ? `<div class="preview-problem">${parsed.romanMismatches} pasted romanization${parsed.romanMismatches === 1 ? "" : "s"} did not match this page's system and ${parsed.romanMismatches === 1 ? "was" : "were"} regenerated.</div>` : ""}`;
    }

    // ------------------------------------------------------------ quiz engine
    // Every exercise keeps its own run, so starting one leaves the others
    // exactly where they were — same question, same score, same clock. An
    // exercise has no entry here until it is started, and loses it when it
    // goes back to setup.
    const STATES = new Map();

    function menuMarkup(exercise) {
      const id = exercise.id;
      return `
        <div class="exercise-menu" id="menu-${id}">
          <h4>Set up the exercise</h4>
          <p>${esc(exercise.blurb)}</p>
          ${exercise.picker()}
          <div class="exercise-menu-grid">
            <label>Question language<select id="menu-question-${id}">${MODES.map(mode => `<option value="${mode.key}"${mode.key === "korean" ? " selected" : ""}>${mode.label}</option>`).join("")}</select></label>
            <label>Answer language<select id="menu-answer-${id}">${MODES.map(mode => `<option value="${mode.key}"${mode.key === "english" ? " selected" : ""}>${mode.label}</option>`).join("")}</select></label>
            <label>Repetitions<select id="menu-multiplier-${id}">${[1, 2, 3, 4, 5].map(n => `<option value="${n}">${n}× each word</option>`).join("")}</select></label>
            <label>Word limit<small class="menu-count-note">0 keeps every selected word</small><input id="menu-cap-${id}" type="number" min="0" step="5" value="0"></label>
            <label>Timer in minutes<small class="menu-count-note">0 = untimed</small><input id="menu-timer-${id}" type="number" min="0" step="0.5" value="0"></label>
            <label style="align-content: end;"><span style="display: flex; align-items: center; gap: 9px; text-transform: none; letter-spacing: 0; font-size: .84rem;"><input id="menu-repeat-${id}" type="checkbox" checked style="width: 1.1rem; height: 1.1rem;">Retry a word until it is right</span></label>
          </div>
          <div class="menu-summary" id="menu-count-${id}"></div>
          <p class="menu-error hidden" id="menu-error-${id}">${esc(exercise.emptyMessage)}</p>
          <div class="exercise-menu-actions">
            <button class="primary-btn" type="button" data-start="${id}">Start exercise</button>
          </div>
        </div>`;
    }

    function runnerMarkup(exercise) {
      const id = exercise.id;
      return `
        <article class="quiz-card hidden" id="quiz-card-${id}">
          <div class="exercise-head">
            <div class="exercise-head-copy">
              <span class="exercise-kicker">${esc(exercise.kicker)}</span>
              <h3>${esc(exercise.title)}</h3>
            </div>
            <div class="score" id="score-${id}" aria-live="polite"></div>
          </div>
          <div class="quiz-body">
            <div id="live-${id}">
              <div class="runtime-bar">
                <span class="runtime-timer" id="timer-${id}">Untimed</span>
                <button class="restart-top-btn" type="button" data-end="${id}">End exercise</button>
              </div>
              <div class="status-row"><div id="question-number-${id}"></div><div id="pool-label-${id}" class="small"></div></div>
              <div class="progress" role="progressbar" aria-label="Exercise progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-${id}"></div></div>
              <div class="prompt-label" id="prompt-label-${id}"></div>
              <p class="prompt" id="prompt-${id}"></p>
              <form class="answer-form" data-exercise="${id}">
                <input class="answer-input" id="input-${id}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer">
                <button class="primary-btn" id="check-${id}" type="submit">Check</button>
              </form>
              <div class="feedback" id="feedback-${id}" aria-live="polite"></div>
              <button class="secondary-btn hidden" type="button" data-next="${id}">Next</button>
            </div>

            <div class="finish-panel" id="finish-${id}">
              <span class="prompt-label" id="finish-kicker-${id}">Exercise complete</span>
              <p class="finish-headline" id="final-score-${id}"></p>
              <div class="finish-block export-block hidden" id="export-${id}">
                <div class="export-head">
                  <h4>Words to review</h4>
                  <div class="export-actions">
                    <button class="btn secondary" type="button" data-copy="${id}">Copy</button>
                    <button class="btn secondary" type="button" data-download="${id}">Download .md</button>
                    <button class="btn positive" type="button" data-send="${id}">Practice these again</button>
                  </div>
                </div>
                <textarea class="export-text" id="export-text-${id}" spellcheck="false" readonly></textarea>
              </div>
              <div class="finish-block review" id="review-${id}"></div>
              <div class="finish-actions">
                <button class="primary-btn" type="button" data-restart="${id}">Back to setup</button>
              </div>
            </div>
          </div>
        </article>`;
    }

    function renderExercises() {
      document.getElementById("exerciseSections").innerHTML = EXERCISES.map(exercise => `
        <details class="quiz-section" id="exercise-${exercise.id}">
          <summary><span>${esc(exercise.kicker)} — ${esc(exercise.title)}</span></summary>
          <div class="quiz-body" style="padding: 0;">
            ${menuMarkup(exercise)}
            ${runnerMarkup(exercise)}
          </div>
        </details>`).join("");

      EXERCISES.forEach(exercise => {
        if (exercise.onRender) exercise.onRender();
        refreshCount(exercise.id);
      });
      attachExerciseListeners();
    }

    function refreshCount(exerciseId) {
      const exercise = EXERCISES.find(e => e.id === exerciseId);
      const target = document.getElementById(`menu-count-${exerciseId}`);
      if (!exercise || !target) return;
      if (exercise.beforeCount) exercise.beforeCount();
      const words = exercise.select();
      const multiplier = Number(document.getElementById(`menu-multiplier-${exerciseId}`)?.value) || 1;
      const cap = Math.max(0, Number(document.getElementById(`menu-cap-${exerciseId}`)?.value) || 0);
      const used = cap > 0 ? Math.min(cap, words.length) : words.length;
      const note = exercise.countNote ? exercise.countNote() : "";
      target.classList.toggle("empty", used === 0);
      target.textContent = used === 0
        ? `No words selected${note}`
        : `${used} word${used === 1 ? "" : "s"} selected · ${used * multiplier} question${used * multiplier === 1 ? "" : "s"}${cap > 0 && words.length > cap ? ` · sampled from ${words.length}` : ""}${note}`;
    }

    function attachExerciseListeners() {
      const container = document.getElementById("exerciseSections");

      container.addEventListener("change", event => {
        const exercise = event.target.closest(".quiz-section");
        if (exercise) refreshCount(exercise.id.replace("exercise-", ""));
      });

      container.addEventListener("click", event => {
        const checkAll = event.target.closest("[data-check-all]");
        if (checkAll) {
          document.querySelectorAll(`input[data-group="${checkAll.dataset.checkAll}"]`).forEach(input => { input.checked = true; });
          refreshCount(checkAll.closest(".quiz-section").id.replace("exercise-", ""));
          return;
        }
        const clearAll = event.target.closest("[data-clear-all]");
        if (clearAll) {
          document.querySelectorAll(`input[data-group="${clearAll.dataset.clearAll}"]`).forEach(input => { input.checked = false; });
          refreshCount(clearAll.closest(".quiz-section").id.replace("exercise-", ""));
          return;
        }
        const start = event.target.closest("[data-start]");
        if (start) { startQuiz(start.dataset.start); return; }
        const next = event.target.closest("[data-next]");
        if (next) { advance(next.dataset.next); return; }
        const end = event.target.closest("[data-end]");
        if (end) { finish(end.dataset.end, "Ended early"); return; }
        const restart = event.target.closest("[data-restart]");
        if (restart) { showSetup(restart.dataset.restart); return; }
        const copy = event.target.closest("[data-copy]");
        if (copy) { copyExport(copy); return; }
        const download = event.target.closest("[data-download]");
        if (download) { downloadExport(download.dataset.download); return; }
        const send = event.target.closest("[data-send]");
        if (send) { sendToCustom(send.dataset.send); return; }
      });

      container.addEventListener("submit", event => {
        const form = event.target.closest(".answer-form");
        if (!form) return;
        event.preventDefault();
        const id = form.dataset.exercise;
        const state = STATES.get(id);
        if (!state || state.answered) return;
        answer(id, document.getElementById(`input-${id}`).value);
      });
    }

    // The card body holds two views: the running question and the summary.
    // Exactly one of them is on screen, so the frame around them never changes.
    function showPhase(exerciseId, phase) {
      document.getElementById(`live-${exerciseId}`).classList.toggle("hidden", phase !== "live");
      document.getElementById(`finish-${exerciseId}`).classList.toggle("shown", phase === "finish");
    }

    function showSetup(exerciseId) {
      const state = STATES.get(exerciseId);
      if (state) {
        clearTimer(state);
        state.finished = true;
        STATES.delete(exerciseId);
      }
      document.getElementById(`menu-${exerciseId}`).classList.remove("hidden");
      document.getElementById(`quiz-card-${exerciseId}`).classList.add("hidden");
      showPhase(exerciseId, "live");
      refreshCount(exerciseId);
    }

    function clearTimer(state) {
      if (state && state.timer) clearInterval(state.timer);
      if (state) state.timer = null;
    }

    function startQuiz(exerciseId) {
      const exercise = EXERCISES.find(e => e.id === exerciseId);
      // Shuffled up front, so a run never follows the order the words were
      // listed, pasted, or sorted in — and the cap takes a random slice.
      let words = shuffle(exercise.select());
      const error = document.getElementById(`menu-error-${exerciseId}`);
      if (!words.length) { error.classList.remove("hidden"); return; }
      error.classList.add("hidden");

      const cap = Math.max(0, Number(document.getElementById(`menu-cap-${exerciseId}`).value) || 0);
      if (cap > 0 && words.length > cap) words = words.slice(0, cap);

      const multiplier = Math.max(1, Number(document.getElementById(`menu-multiplier-${exerciseId}`).value) || 1);
      const pool = [];
      for (let round = 0; round < multiplier; round++) words.forEach(word => pool.push(word));

      // The modes decide what a question looks like, so the ordering needs them.
      const questionMode = document.getElementById(`menu-question-${exerciseId}`).value;
      const answerMode = document.getElementById(`menu-answer-${exerciseId}`).value;

      // Only this exercise's previous run is discarded; the others keep theirs.
      clearTimer(STATES.get(exerciseId));
      const state = {
        exerciseId,
        pool: words,
        questions: spacedOrder(pool, word => questionKeys(word, questionMode, answerMode)),
        index: 0,
        score: 0,
        answered: false,
        results: [],
        currentAttempts: [],
        currentHadWrong: false,
        retryCurrent: false,
        finished: false,
        repeatWrong: document.getElementById(`menu-repeat-${exerciseId}`).checked,
        questionMode,
        answerMode,
        timer: null,
        label: `${exercise.title} · ${words.length} words`
      };
      STATES.set(exerciseId, state);

      document.getElementById(`menu-${exerciseId}`).classList.add("hidden");
      document.getElementById(`quiz-card-${exerciseId}`).classList.remove("hidden");
      showPhase(exerciseId, "live");
      document.querySelector(`.answer-form[data-exercise="${exerciseId}"]`).classList.remove("hidden");
      document.getElementById(`pool-label-${exerciseId}`).textContent = state.label;

      const minutes = Math.max(0, Number(document.getElementById(`menu-timer-${exerciseId}`).value) || 0);
      const timerLabel = document.getElementById(`timer-${exerciseId}`);
      if (!minutes) timerLabel.textContent = "Untimed";
      else {
        const deadline = Date.now() + minutes * 60000;
        const tick = () => {
          const remaining = Math.max(0, (deadline - Date.now()) / 1000);
          const safe = Math.ceil(remaining);
          timerLabel.textContent = `Time left: ${Math.floor(safe / 60)}:${String(safe % 60).padStart(2, "0")}`;
          if (remaining <= 0) finish(exerciseId, "Time is up");
        };
        tick();
        state.timer = setInterval(tick, 250);
      }

      showQuestion(exerciseId);
    }

    function showQuestion(exerciseId, isRetry = false) {
      const state = STATES.get(exerciseId);
      if (!state || state.finished || !state.questions.length) return;
      const item = state.questions[state.index];
      state.answered = false;
      if (!isRetry) {
        state.currentAttempts = [];
        state.currentHadWrong = false;
        state.retryCurrent = false;
      }

      document.getElementById(`question-number-${exerciseId}`).textContent =
        `Question ${state.index + 1} / ${state.questions.length}${isRetry ? " · retry" : ""}`;
      document.getElementById(`score-${exerciseId}`).textContent = `Score: ${state.score}`;
      const percent = (state.index / state.questions.length) * 100;
      const bar = document.getElementById(`progress-${exerciseId}`);
      bar.style.width = `${percent}%`;
      bar.parentElement.setAttribute("aria-valuenow", String(Math.round(percent)));
      document.getElementById(`prompt-label-${exerciseId}`).textContent = modeLabel(state.questionMode);
      document.getElementById(`prompt-${exerciseId}`).textContent = displayValue(item, state.questionMode);

      const input = document.getElementById(`input-${exerciseId}`);
      input.value = "";
      input.readOnly = false;
      input.placeholder = state.answerMode === "romanization"
        ? "Type with dashes (Space = dash, double Space = space)"
        : "Type your answer";
      // In romanization mode the space bar types the syllable dash, since that
      // is what separates syllables; pressing it twice gives a real space.
      input.onkeydown = event => {
        if (event.key === "Enter") {
          event.preventDefault();
          if (state.answered) document.querySelector(`[data-next="${exerciseId}"]`).click();
          else document.querySelector(`.answer-form[data-exercise="${exerciseId}"]`).requestSubmit();
          return;
        }
        if (state.answerMode === "romanization" && event.key === " ") {
          event.preventDefault();
          const start = input.selectionStart ?? input.value.length;
          const end = input.selectionEnd ?? start;
          const value = input.value;
          if (start > 0 && value[start - 1] === "-") {
            input.value = value.slice(0, start - 1) + " " + value.slice(end);
            input.setSelectionRange(start, start);
          } else {
            input.value = value.slice(0, start) + "-" + value.slice(end);
            input.setSelectionRange(start + 1, start + 1);
          }
        }
      };

      document.getElementById(`check-${exerciseId}`).disabled = false;
      const feedback = document.getElementById(`feedback-${exerciseId}`);
      feedback.className = "feedback";
      feedback.innerHTML = "";
      document.querySelector(`[data-next="${exerciseId}"]`).classList.add("hidden");
      requestAnimationFrame(() => input.focus({ preventScroll: true }));
    }

    function pushResult(state, item, userAnswer, correct, masteredAfterRetry) {
      state.results.push({
        id: item.id,
        item,
        prompt: displayValue(item, state.questionMode),
        expected: itemAnswerDisplay(item, state.answerMode),
        full: fullEntry(item),
        userAnswer,
        attempts: [...state.currentAttempts],
        correct,
        masteredAfterRetry
      });
    }

    function answer(exerciseId, userAnswer) {
      const state = STATES.get(exerciseId);
      if (!state || state.answered || state.finished) return;
      const item = state.questions[state.index];
      const correct = isCorrect(state.pool, item, state.questionMode, state.answerMode, userAnswer);
      const feedback = document.getElementById(`feedback-${exerciseId}`);
      state.answered = true;
      state.currentAttempts.push({ userAnswer, correct });

      if (correct) {
        if (!state.currentHadWrong) state.score += 1;
        feedback.className = "feedback good";
        feedback.innerHTML = `${state.currentHadWrong ? "Correct on retry." : "Correct."} <span class="answer-key">${esc(itemAnswerDisplay(item, state.answerMode))}</span>`;
        pushResult(state, item, userAnswer, !state.currentHadWrong, state.currentHadWrong);
        state.retryCurrent = false;
      } else {
        state.currentHadWrong = true;
        feedback.className = "feedback bad";
        feedback.innerHTML = `Not quite. Correct answer: <span class="answer-key">${esc(itemAnswerDisplay(item, state.answerMode))}</span><br><span class="small">Full entry: ${esc(fullEntry(item))}</span>`;
        if (state.repeatWrong) {
          state.retryCurrent = true;
        } else {
          pushResult(state, item, userAnswer, false, false);
          state.retryCurrent = false;
        }
      }

      document.getElementById(`score-${exerciseId}`).textContent = `Score: ${state.score}`;
      const input = document.getElementById(`input-${exerciseId}`);
      input.readOnly = true;
      document.getElementById(`check-${exerciseId}`).disabled = true;
      const next = document.querySelector(`[data-next="${exerciseId}"]`);
      next.textContent = state.retryCurrent
        ? "Retry question"
        : (state.index === state.questions.length - 1 ? "Finish" : "Next");
      next.classList.remove("hidden");
      requestAnimationFrame(() => input.focus({ preventScroll: true }));
    }

    function advance(exerciseId) {
      const state = STATES.get(exerciseId);
      if (!state) return;
      if (state.retryCurrent) { showQuestion(exerciseId, true); return; }
      if (state.index >= state.questions.length - 1) { finish(exerciseId, "Completed"); return; }
      state.index += 1;
      showQuestion(exerciseId);
    }

    function finish(exerciseId, reason) {
      const state = STATES.get(exerciseId);
      if (!state || state.finished) return;
      // A word still mid-retry when the timer runs out counts as missed.
      if (state.retryCurrent && state.currentAttempts.length) {
        const item = state.questions[state.index];
        pushResult(state, item, state.currentAttempts[state.currentAttempts.length - 1].userAnswer, false, false);
        state.retryCurrent = false;
      }
      state.finished = true;
      clearTimer(state);

      const answered = state.results.length;
      const percent = answered ? Math.round((state.score / answered) * 100) : 0;
      const bar = document.getElementById(`progress-${exerciseId}`);
      bar.style.width = "100%";
      bar.parentElement.setAttribute("aria-valuenow", "100");
      document.querySelector(`.answer-form[data-exercise="${exerciseId}"]`).classList.add("hidden");
      document.querySelector(`[data-next="${exerciseId}"]`).classList.add("hidden");

      // The score chip in the card header carries the result, so the summary
      // opens on the same line the running exercise left off on.
      showPhase(exerciseId, "finish");
      document.getElementById(`finish-kicker-${exerciseId}`).textContent =
        reason === "Completed" ? "Exercise complete" : reason;
      document.getElementById(`score-${exerciseId}`).textContent = answered ? `${percent}%` : "—";
      document.getElementById(`final-score-${exerciseId}`).innerHTML = answered
        ? `First-try score <strong>${state.score} / ${answered}</strong><span class="finish-sub">${answered} of ${state.questions.length} questions completed · ${modeLabel(state.questionMode)} → ${modeLabel(state.answerMode)}</span>`
        : "No questions were answered.";

      renderExport(exerciseId, state);
      document.getElementById(`review-${exerciseId}`).innerHTML = answered ? `
        <h3>Review</h3>
        ${state.results.map((result, i) => {
          const attemptText = result.attempts.map((attempt, n) => `${n + 1}: ${attempt.userAnswer || "(blank)"}${attempt.correct ? " ✓" : " ✗"}`).join(" · ");
          const status = result.masteredAfterRetry ? "↻" : (result.correct ? "✅" : "❌");
          return `
            <div class="review-row">
              <div><strong>${i + 1}. ${esc(result.prompt)}</strong><br><span class="small">Attempts: ${esc(attemptText)}</span></div>
              <div>${status} <strong>${esc(result.expected)}</strong><br><span class="small">${esc(result.full)}</span></div>
            </div>`;
        }).join("")}` : "";

      document.getElementById(`quiz-card-${exerciseId}`).scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    // Anything missed outright or only got right on a retry, deduplicated, in
    // the same english / romanization / korean format the paste box reads.
    function missedWords(state) {
      const seen = new Set();
      return state.results
        .filter(result => !result.correct || result.masteredAfterRetry)
        .filter(result => (seen.has(result.id) ? false : seen.add(result.id)))
        .map(result => result.item);
    }

    function exportMarkdown(state) {
      const words = missedWords(state);
      const exercise = EXERCISES.find(e => e.id === state.exerciseId);
      const header = [
        `# Missed words — ${exercise ? exercise.title : "Practice"} — ${new Date().toISOString().slice(0, 10)}`,
        `# ${modeLabel(state.questionMode)} → ${modeLabel(state.answerMode)} · ${words.length} of ${state.pool.length} words · scored ${state.score}/${state.results.length}`,
        ""
      ];
      return header.concat(words.map(fullEntry)).join("\n") + "\n";
    }

    function renderExport(exerciseId, state) {
      const block = document.getElementById(`export-${exerciseId}`);
      const words = missedWords(state);
      block.classList.toggle("hidden", words.length === 0);
      if (!words.length) return;
      block.querySelector(".export-head h4").textContent = `${words.length} word${words.length === 1 ? "" : "s"} to review`;
      document.getElementById(`export-text-${exerciseId}`).value = exportMarkdown(state);
    }

    function copyExport(button) {
      const text = document.getElementById(`export-text-${button.dataset.copy}`).value;
      navigator.clipboard.writeText(text).then(() => {
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = "Copy"; }, 1600);
      }).catch(() => {
        button.textContent = "Press Ctrl+C";
        document.getElementById(`export-text-${button.dataset.copy}`).select();
      });
    }

    function downloadExport(exerciseId) {
      const blob = new Blob([document.getElementById(`export-text-${exerciseId}`).value], { type: "text/markdown" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `missed-words-${new Date().toISOString().slice(0, 10)}.md`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function sendToCustom(exerciseId) {
      const input = document.getElementById("custom-input");
      const existing = input.value.trim();
      input.value = (existing ? existing + "\n\n" : "") + document.getElementById(`export-text-${exerciseId}`).value;
      // The export is always english / romanization / korean, so a mapping
      // left over from an earlier paste would misread it.
      const separator = document.getElementById("custom-sep");
      separator.value = "auto";
      separator.dispatchEvent(new Event("change", { bubbles: true }));
      refreshCount("custom");
      document.getElementById("exercise-custom").open = true;
      showSetup("custom");
      document.getElementById("exercise-custom").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ------------------------------------------------------------------ page
    // A vocabulary page can hand its missed words over: it parks the export
    // under this key and links here, so the list is already in the box.
    const HANDOFF_KEY = "koreanCustomListHandoffV1";

    function readHandoff() {
      let text = "";
      try {
        text = localStorage.getItem(HANDOFF_KEY) || "";
        localStorage.removeItem(HANDOFF_KEY);
      } catch (_) {}
      if (!text.trim()) return;
      const input = document.getElementById("custom-input");
      const existing = input.value.trim();
      input.value = (existing ? existing + "\n\n" : "") + text;
      refreshCount("custom");
    }

    function renderStats() {
      document.getElementById("statStrip").innerHTML = `
        <span class="stat-chip">Any list, any separator</span>
        <span class="stat-chip"><strong>${BANK.length}</strong> known words matched automatically</span>
        <span class="stat-chip">Korean, romanization, or English in either direction</span>`;
    }

    renderStats();
    renderExercises();
    readHandoff();
  })();
  </script>

  <script>
    (() => {
      const STORAGE_KEY = "koreanQuizThemeV2";
      const ANCHOR_KEY = `koreanStudyAnchor:${location.pathname}`;
      const root = document.documentElement;
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const toggles = [...document.querySelectorAll("[data-theme-toggle]")];

      function savedTheme() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }
      }

      function applyTheme(theme, persist = false) {
        const next = theme === "dark" ? "dark" : "light";
        root.dataset.theme = next;
        root.style.colorScheme = next;
        if (persist) {
          try { localStorage.setItem(STORAGE_KEY, next); } catch (_) {}
        }
        toggles.forEach(toggle => {
          const dark = next === "dark";
          toggle.setAttribute("aria-pressed", String(dark));
          toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
          toggle.title = dark ? "Switch to light mode" : "Switch to dark mode";
          const icon = toggle.querySelector("[data-theme-icon]");
          if (icon) icon.textContent = dark ? "☀" : "☾";
        });
      }

      applyTheme(savedTheme() || (media.matches ? "dark" : "light"));

      toggles.forEach(toggle => {
        toggle.addEventListener("click", () => {
          applyTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
        });
      });

      media.addEventListener?.("change", event => {
        if (!savedTheme()) applyTheme(event.matches ? "dark" : "light");
      });

      function storeAnchor(hash) {
        try {
          if (hash && hash !== "#top") localStorage.setItem(ANCHOR_KEY, hash);
          else localStorage.removeItem(ANCHOR_KEY);
        } catch (_) {}
      }

      document.addEventListener("click", event => {
        const link = event.target.closest('a[href^="#"]');
        if (link) storeAnchor(link.getAttribute("href"));
      });

      window.addEventListener("hashchange", () => storeAnchor(location.hash));

      if (!location.hash) {
        let saved = "";
        try { saved = localStorage.getItem(ANCHOR_KEY) || ""; } catch (_) {}
        if (saved && document.querySelector(saved)) {
          requestAnimationFrame(() => document.querySelector(saved)?.scrollIntoView());
        } else {
          requestAnimationFrame(() => window.scrollTo(0, 0));
        }
      }
    })();
  </script>


  </script>
