  <script>
    (() => {
      try {
        const saved = localStorage.getItem("koreanQuizThemeV2");
        const theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    })();

  <script>

      // Vocabulary entries use: [Korean, dashed romanization, English]
      const VOCABULARY_BANK= {

      };
      // Grammar entries use: [id, form, title, explanation, Korean, romanization, English]
      const GRAMMAR_POINTS=[["g1", "은/는", "Topic particle", "Marks the topic or contrast. Use 은 after a consonant and 는 after a vowel.", "저는 학생이에요.", "jeo-neun hak-ssaeng-i-e-yo", "I am a student."],
      ["g2", "이/가", "Subject particle", "Marks a new, focused, or identified subject.", "고양이가 귀여워요.", "go-yang-i-ga gwi-yeo-wo-yo", "The cat is cute."],
      ["g3", "을/를", "Object particle", "Marks the direct object of an action verb.", "커피를 마셔요.", "keo-pi-reul ma-syeo-yo", "I drink coffee."],
      ["g4", "에", "Destination, location, or time", "Use 에 for destination, static location, or time.", "학교에 가요.", "hak-kkyo-e ga-yo", "I go to school."],
      ["g5", "에서", "Place of action", "Use 에서 where an action happens or where movement starts.", "카페에서 공부해요.", "ka-pe-e-seo gong-bu-hae-yo", "I study at a cafe."],
      ["g6", "이다", "To be", "Attach 이에요/예요 or 입니다 directly to a noun.", "친구예요.", "chin-gu-ye-yo", "He or she is a friend."],
      ["g7", "있다 / 없다", "Existence and possession", "있다 means exist or have; 없다 means not exist or not have.", "시간이 있어요.", "si-ga-ni i-sseo-yo", "I have time."],
      ["g8", "안 + verb", "Short negation", "Place 안 before a verb or adjective.", "안 가요.", "an ga-yo", "I do not go."],
      ["g9", "못 + verb", "Inability", "Use 못 when ability or circumstances prevent an action.", "오늘 못 가요.", "o-neul mot ga-yo", "I cannot go today."],
      ["g10", "-아/어/해요", "Present tense", "Basic everyday polite present tense.", "밥을 먹어요.", "ba-beul meo-geo-yo", "I eat a meal."],
      ["g11", "-았/었/했어요", "Past tense", "Marks a completed past action or state.", "어제 공부했어요.", "eo-je gong-bu-hae-sseo-yo", "I studied yesterday."],
      ["g12", "-(으)ㄹ 거예요", "Future tense", "Expresses a future plan, intention, or prediction.", "내일 갈 거예요.", "nae-il gal geo-ye-yo", "I will go tomorrow."],
      ["g13", "-(으)세요", "Polite request", "A polite everyday request or command.", "앉으세요.", "an-jeu-se-yo", "Please sit down."],
      ["g14", "-(으)십시오", "Formal command", "A formal command used in instructions or announcements.", "기다리십시오.", "gi-da-ri-ship-ssi-o", "Please wait."],
      ["g15", "-(으)ㅂ시다", "Let’s", "Makes a formal-sounding suggestion.", "같이 갑시다.", "ga-chi gap-ssi-da", "Let’s go together."],
      ["g16", "-(으)ㄹ까요?", "Shall we?", "A soft suggestion or request for an opinion.", "점심 먹을까요?", "jeom-shim meo-geul-kka-yo", "Shall we eat lunch?"],
      ["g17", "-고", "And / then", "Connects actions or descriptions without expressing cause.", "밥을 먹고 공부해요.", "ba-beul meok-kko gong-bu-hae-yo", "I eat and then study."],
      ["g18", "-아서/어서", "Because / then", "Connects clauses by reason or natural sequence.", "피곤해서 쉬어요.", "pi-go-nae-seo swi-eo-yo", "I am tired, so I rest."],
      ["g19", "-지만", "But / although", "Connects contrasting clauses.", "비싸지만 좋아요.", "bi-ssa-ji-man jo-a-yo", "It is expensive, but good."],
      ["g20", "-(으)면", "If / when", "Expresses a condition.", "시간이 있으면 만나요.", "si-ga-ni i-sseu-myeon man-na-yo", "If you have time, let’s meet."],
      ["g21", "-(으)려고 하다", "Intention / plan", "Means intend to, plan to, or be about to.", "책을 사려고 해요.", "chae-geul sa-ryeo-go hae-yo", "I plan to buy a book."],
      ["g22", "-고 싶다", "Want to", "Expresses the speaker’s desire.", "친구를 만나고 싶어요.", "chin-gu-reul man-na-go shi-peo-yo", "I want to meet a friend."],
      ["g23", "-(으)러 가다/오다", "Purpose of movement", "Go or come in order to do an action.", "운동하러 공원에 가요.", "un-dong-ha-reo gong-wo-ne ga-yo", "I go to the park to exercise."],
      ["g24", "-아/어 보다", "Try / experience", "Try doing or have the experience of doing.", "한국 음식을 먹어 봤어요.", "han-guk eum-shi-geul meo-geo bwa-sseo-yo", "I have tried Korean food."],
      ["g25", "-아/어도 되다", "Permission", "Means may, be allowed to, or it is okay to.", "사진 찍어도 돼요?", "sa-jin jji-geo-do dwae-yo", "May I take a photo?"],
      ["g26", "-(으)면 안 되다", "Prohibition", "Means must not or should not.", "여기서 뛰면 안 돼요.", "yeo-gi-seo ttwi-myeon an dwae-yo", "You must not run here."],
      ["g27", "-(으)ㄴ 후에", "After", "One action finishes before another starts.", "밥을 먹은 후에 공부해요.", "ba-beul meo-geun hu-e gong-bu-hae-yo", "I study after eating."],
      ["g28", "-기 전에", "Before", "One action happens before another.", "자기 전에 책을 읽어요.", "ja-gi jeo-ne chae-geul il-geo-yo", "I read a book before sleeping."],
      ["g29", "-(으)ㄹ 수 있다/없다", "Can / cannot", "Expresses ability or possibility.", "한국어를 읽을 수 있어요.", "han-gu-geo-reul il-geul su i-sseo-yo", "I can read Korean."],
      ["g30", "-네요", "Realization / admiration", "A soft reaction after noticing something.", "날씨가 좋네요.", "nal-ssi-ga jon-ne-yo", "Oh, the weather is nice."],
      ["g31", "-군요 / -네요", "Surprise / discovery", "Both express discovery; -네요 is softer.", "정말 빠르군요!", "jeong-mal ppa-reu-gun-yo", "It is really fast, I see!"],
      ["g32", "-(으)ㄴ/는 것 같다", "I think / it seems", "Softens a guess or impression.", "비가 오는 것 같아요.", "bi-ga o-neun geot ga-ta-yo", "I think it is raining."]];
      // Question-generation helpers
      const randomItem=(array)=>array[Math.floor(Math.random()*array.length)];
      const CONSONANT_ENDING_WORDS=new Set(["학생", "선생님", "의사", "간호사", "회사원", "친구", "어머니", "아버지", "집", "학교", "회사", "병원", "은행", "식당", "카페", "공원", "시장", "도서관", "밥", "물", "빵", "과일", "고기", "김치", "라면", "책", "사진", "카드", "돈"]);
      const chooseParticle=(word, consonantForm, vowelForm)=>CONSONANT_ENDING_WORDS.has(word)?consonantForm:vowelForm;
      const createQuestion=(english, romanization, korean)=>( {
        english, romanization, korean
      });
      // Core conjugation lookup tables
      const PRESENT_CONJUGATIONS= {
        가다:["가요", "ga-yo"],
        오다:["와요", "wa-yo"],
        먹다:["먹어요", "meo-geo-yo"],
        마시다:["마셔요", "ma-syeo-yo"],
        보다:["봐요", "bwa-yo"],
        듣다:["들어요", "deu-reo-yo"],
        읽다:["읽어요", "il-geo-yo"],
        쓰다:["써요", "sseo-yo"],
        말하다:["말해요", "mal-hae-yo"],
        공부하다:["공부해요", "gong-bu-hae-yo"],
        일하다:["일해요", "il-hae-yo"],
        자다:["자요", "ja-yo"],
        만나다:["만나요", "man-na-yo"],
        배우다:["배워요", "bae-wo-yo"],
        만들다:["만들어요", "man-deu-reo-yo"],
        좋아하다:["좋아해요", "jo-a-hae-yo"]
      };
      const PAST_CONJUGATIONS= {
        가다:["갔어요", "ga-sseo-yo"],
        오다:["왔어요", "wa-sseo-yo"],
        먹다:["먹었어요", "meo-geo-sseo-yo"],
        마시다:["마셨어요", "ma-syeo-sseo-yo"],
        보다:["봤어요", "bwa-sseo-yo"],
        듣다:["들었어요", "deu-reo-sseo-yo"],
        읽다:["읽었어요", "il-geo-sseo-yo"],
        쓰다:["썼어요", "sseo-sseo-yo"],
        말하다:["말했어요", "mal-hae-sseo-yo"],
        공부하다:["공부했어요", "gong-bu-hae-sseo-yo"],
        일하다:["일했어요", "il-hae-sseo-yo"],
        자다:["잤어요", "ja-sseo-yo"],
        만나다:["만났어요", "man-na-sseo-yo"],
        배우다:["배웠어요", "bae-wo-sseo-yo"],
        만들다:["만들었어요", "man-deu-reo-sseo-yo"],
        좋아하다:["좋아했어요", "jo-a-hae-sseo-yo"]
      };
      const FUTURE_CONJUGATIONS= {
        가다:["갈 거예요", "gal geo-ye-yo"],
        오다:["올 거예요", "ol geo-ye-yo"],
        먹다:["먹을 거예요", "meo-geul geo-ye-yo"],
        마시다:["마실 거예요", "ma-shil geo-ye-yo"],
        보다:["볼 거예요", "bol geo-ye-yo"],
        듣다:["들을 거예요", "deu-reul geo-ye-yo"],
        읽다:["읽을 거예요", "il-geul geo-ye-yo"],
        쓰다:["쓸 거예요", "sseul geo-ye-yo"],
        말하다:["말할 거예요", "mal-hal geo-ye-yo"],
        공부하다:["공부할 거예요", "gong-bu-hal geo-ye-yo"],
        일하다:["일할 거예요", "il-hal geo-ye-yo"],
        자다:["잘 거예요", "jal geo-ye-yo"],
        만나다:["만날 거예요", "man-nal geo-ye-yo"],

        좋아하다:["좋아할 거예요", "jo-a-hal geo-ye-yo"]
      };
      // Tuple aliases: p=person, pl=place, f=food, o=object, t=time, a=adjective, v=verb
      // Build one randomized trilingual question for a grammar point
      function generateQuestion(id) {
        let p=randomItem(VOCABULARY_BANK.people),
        pl=randomItem(VOCABULARY_BANK.places),
        f=randomItem(VOCABULARY_BANK.food),
        o=randomItem(VOCABULARY_BANK.objects),
        t=randomItem(VOCABULARY_BANK.time),
        a=randomItem(VOCABULARY_BANK.adjectives),
        v=randomItem(VOCABULARY_BANK.verbs),
        pn=chooseParticle(p[0],
        "은", "는"),
        pg=chooseParticle(p[0],
        "이", "가"),
        fo=chooseParticle(f[0],
        "을", "를"),
        rn=pn==="은"?"eun":"neun",
        rg=pg==="이"?"i":"ga",
        fro=fo==="을"?"eul":"reul",
        vp=PRESENT_CONJUGATIONS[v[0]],
        va=PAST_CONJUGATIONS[v[0]],
        vf=FUTURE_CONJUGATIONS[v[0]];
        let M= {
          g1:()=>createQuestion(`As for the ${p[2]}, he or she is at the ${pl[2]}.`, `${p[1]}-${rn} ${pl[1]}-e i-sseo-yo`, `${p[0]}${pn} ${pl[0]}에 있어요.`),
          g2:()=>createQuestion(`The ${p[2]} came today.`, `${p[1]}-${rg} o-neul wa-sseo-yo`, `${p[0]}${pg} 오늘 왔어요.`),
          g3:()=>createQuestion(`I ${v[2]} ${f[2]}.`, `${f[1]}-${fro} ${vp[1]}`, `${f[0]}${fo} ${vp[0]}.`),
          g4:()=>createQuestion(`I go to the ${pl[2]} ${t[2]}.`, `${t[1]} ${pl[1]}-e ga-yo`, `${t[0]} ${pl[0]}에 가요.`),
          g5:()=>createQuestion(`I study at the ${pl[2]}.`, `${pl[1]}-e-seo gong-bu-hae-yo`, `${pl[0]}에서 공부해요.`),
          g6:()=>createQuestion(`He or she is a ${p[2]}.`, `${p[1]}-${chooseParticle(p[0],"i-e-yo","ye-yo")}`, `${p[0]}${chooseParticle(p[0],"이에요","예요")}.`),
          g7:()=>createQuestion(`There is ${f[2]} at the ${pl[2]}.`, `${pl[1]}-e ${f[1]}-${chooseParticle(f[0],"i","ga")} i-sseo-yo`, `${pl[0]}에 ${f[0]}${chooseParticle(f[0],"이","가")} 있어요.`),
          g8:()=>createQuestion(`I do not ${v[2]} ${t[2]}.`, `${t[1]} an ${vp[1]}`, `${t[0]} 안 ${vp[0]}.`),
          g9:()=>createQuestion(`I cannot ${v[2]} ${t[2]}.`, `${t[1]} mot ${vp[1]}`, `${t[0]} 못 ${vp[0]}.`),
          g10:()=>createQuestion(`I ${v[2]} ${f[2]}.`, `${f[1]}-${fro} ${vp[1]}`, `${f[0]}${fo} ${vp[0]}.`),
          g11:()=>createQuestion(`I did ${v[2]} ${t[2]}.`, `${t[1]} ${va[1]}`, `${t[0]} ${va[0]}.`),
          g12:()=>createQuestion(`I will ${v[2]} ${t[2]}.`, `${t[1]} ${vf[1]}`, `${t[0]} ${vf[0]}.`),
          g13:()=>createQuestion(`Please ${v[2]}.`, `${vp[1].replace(/-yo$/,"-se-yo")}`, `${vp[0].replace("요","세요")}.`),
          g14:()=>createQuestion(`Please ${v[2]}.`, `${vp[1].replace(/-yo$/,"-ship-ssi-o")}`, `${vp[0].replace("요","십시오")}.`),
          g15:()=>createQuestion(`Let's ${v[2]} together.`, `ga-chi ${vf[1].split(" ")[0]}-p-ssi-da`, `같이 ${vf[0].replace(" 거예요","ㅂ시다")}.`),
          g16:()=>createQuestion(`Shall we ${v[2]} together?`, `ga-chi ${vf[1].replace(" geo-ye-yo","-kka-yo")}`, `같이 ${vf[0].replace(" 거예요","까요")}?`),
          g17:()=>createQuestion(`I ${v[2]} and then go to the ${pl[2]}.`, `${v[1].replace(/-da$/,"-go")} ${pl[1]}-e ga-yo`, `${v[0].slice(0,-1)}고 ${pl[0]}에 가요.`),
          g18:()=>createQuestion(`Because it is ${a[2]}, I rest.`, `${a[1].replace(/-da$/,"-seo")} swi-eo-yo`, `${a[0].slice(0,-1)}서 쉬어요.`),
          g19:()=>createQuestion(`It is ${a[2]}, but interesting.`, `${a[1].replace(/-da$/,"-ji-man")} jae-mi-i-sseo-yo`, `${a[0].slice(0,-1)}지만 재미있어요.`),
          g20:()=>createQuestion(`If I have ${o[2]}, I will go to the ${pl[2]}.`, `${o[1]}-${chooseParticle(o[0],"i","ga")} i-sseu-myeon ${pl[1]}-e gal geo-ye-yo`, `${o[0]}${chooseParticle(o[0],"이","가")} 있으면 ${pl[0]}에 갈 거예요.`),
          g21:()=>createQuestion(`I plan to ${v[2]} ${t[2]}.`, `${t[1]} ${vf[1].replace(" geo-ye-yo","-ryeo-go hae-yo")}`, `${t[0]} ${vf[0].replace(" 거예요","려고 해요")}.`),
          g22:()=>createQuestion(`I want to ${v[2]} ${f[2]}.`, `${f[1]}-${fro} ${v[1].replace(/-da$/,"-go shi-peo-yo")}`, `${f[0]}${fo} ${v[0].slice(0,-1)}고 싶어요.`),
          g23:()=>createQuestion(`I go to the ${pl[2]} in order to ${v[2]}.`, `${v[1].replace(/-da$/,"-reo")} ${pl[1]}-e ga-yo`, `${v[0].slice(0,-1)}러 ${pl[0]}에 가요.`),
          g24:()=>createQuestion(`I have tried ${v[2]}ing ${f[2]}.`, `${f[1]}-${fro} ${vp[1].replace(/-yo$/," bwa-sseo-yo")}`, `${f[0]}${fo} ${vp[0].replace("요"," 봤어요")}.`),
          g25:()=>createQuestion(`May I ${v[2]} here?`, `yeo-gi-seo ${vp[1].replace(/-yo$/,"-do dwae-yo")}`, `여기서 ${vp[0].replace("요","도 돼요")}?`),
          g26:()=>createQuestion(`You must not ${v[2]} here.`, `yeo-gi-seo ${vf[1].split(" ")[0]}-myeon an dwae-yo`, `여기서 ${vf[0].replace(" 거예요","면 안 돼요")}.`),
          g27:()=>createQuestion(`I go to the ${pl[2]} after ${v[2]}ing.`, `${va[1].replace(/-sseo-yo$/,"-eun hu-e")} ${pl[1]}-e ga-yo`, `${va[0].replace("었어요","은 후에").replace("았어요","ㄴ 후에").replace("했어요","한 후에")} ${pl[0]}에 가요.`),
          g28:()=>createQuestion(`I ${v[2]} before going to the ${pl[2]}.`, `${pl[1]}-e ga-gi jeo-ne ${vp[1]}`, `${pl[0]}에 가기 전에 ${vp[0]}.`),
          g29:()=>createQuestion(`I can ${v[2]} ${f[2]}.`, `${f[1]}-${fro} ${vf[1].replace(" geo-ye-yo"," su i-sseo-yo")}`, `${f[0]}${fo} ${vf[0].replace(" 거예요"," 수 있어요")}.`),

          g32:()=>createQuestion(`I think the ${p[2]} is at the ${pl[2]}.`, `${p[1]}-${rg} ${pl[1]}-e in-neun geot ga-ta-yo`, `${p[0]}${pg} ${pl[0]}에 있는 것 같아요.`)

      // Quiz state and answer utilities

      function escapeHtml(s) {
        return String(s??"").replace(/[&<>"']/g, m=>( {
          "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
        }
        [m]))
      }
      function normalizeAnswer(s, m) {

        return m==="korean"?s.replace(/\s+/g, "").replace(/[.?!]/g, ""):s.replace(/[^a-z0-9가-힣]+/g, " ").replace(/\s+/g, " ").trim()

      function feedbackMarkup(q) {

      }
      // Rendering
      function renderApp() {
        grammarGrid.innerHTML=GRAMMAR_POINTS.map(x=>`<article class="grammar-card"><h3>${x[1]} · ${x[2]}</h3><p>${x[3]}</p><div class="example"><b>${x[6]}</b><br><span class="roman">${x[5]}</span><br>${x[4]}</div></article>`).join("");

      function exerciseTemplate(id, t, title) {

      // Exercise lifecycle
      function initializeExercise(id, t) {
        let e=document.getElementById(`${id}-${t}`),
        qm=e.querySelector(".question-mode"),
        am=e.querySelector(".answer-mode"),
        key=`${id}-${t}`;

          id,

          qs:[],

          qm:"english",
          am:"korean",

        };
        let reset=()=> {
          let s=exerciseStates[key];
          s.i=0;
          s.score=0;
          s.r=[];
          s.qm=qm.value;
          s.am=am.value;
          if(s.qm===s.am) {
            s.am=s.qm==="english"?"korean":"english";

            length:10

      function showQuestion(id, t) {
        let s=exerciseStates[`${id}-${t}`],
        e=document.getElementById(`${id}-${t}`),

        e.querySelector(".prompt-label").textContent=s.qm;
        e.querySelector(".prompt").textContent=q[s.qm];

        if(t==="typed") {
          z.innerHTML=`<div class="answer-row"><label class="sr-only" for="${id}-${t}-answer">Your answer</label><input id="${id}-${t}-answer" class="ans" autocomplete="off"><button class="btn primary" type="button">Check</button></div>`;
          let go=()=>submitAnswer(id, t, z.querySelector("input").value);
          z.querySelector("button").onclick=go;
          z.querySelector("input").onkeydown=x=>x.key==="Enter"&&go();
          z.querySelector("input").focus()
        }
        else {
          let opts=[q, ...Array.from( {
            length:5
          },
          ()=>generateQuestion(id))].sort(()=>Math.random()-.5).slice(0, 4);
          if(!opts.includes(q))opts[0]=q;
          z.innerHTML=`<div class="choices">${opts.map((o,i)=>`<button class="choice" type="button" data-i="${i}">${escapeHtml(o[s.am])}</button>`).join("")}</div>`;
          z.querySelectorAll(".choice").forEach((b, i)=>b.onclick=()=> {
            let ok=normalizeAnswer(opts[i][s.am],
            s.am)===normalizeAnswer(q[s.am],
            s.am);
            z.querySelectorAll(".choice").forEach((bb, j)=> {
              bb.disabled=true;
              if(normalizeAnswer(opts[j][s.am],
              s.am)===normalizeAnswer(q[s.am],
              s.am))bb.classList.add("correct")
            });
            if(!ok)b.classList.add("wrong");
            completeQuestion(id, t, opts[i][s.am],
            ok)
          })
        }
      }
      function submitAnswer(id, t, u) {
        let s=exerciseStates[`${id}-${t}`],
        q=s.qs[s.i];
        completeQuestion(id, t, u, normalizeAnswer(u, s.am)===normalizeAnswer(q[s.am],
        s.am))
      }
      function completeQuestion(id, t, u, ok) {
        let s=exerciseStates[`${id}-${t}`],
        e=document.getElementById(`${id}-${t}`),
        q=s.qs[s.i];
        if(s.done)return;
        s.done=true;
        if(ok)s.score++;

          q, u, ok, qm:s.qm, am:s.am
        });
        e.querySelector(".score").textContent=`Score: ${s.score}`;
        let f=e.querySelector(".feedback");
        f.className=`feedback ${ok?"good":"bad"}`;
        f.innerHTML=`${ok?"Correct.":"Not quite."}<br>${feedbackMarkup(q)}`;
        let n=e.querySelector(".next");
        n.textContent=s.i===9?"Finish":"Next";
        n.classList.remove("hidden")
      }
      function finishExercise(id, t) {
        let s=exerciseStates[`${id}-${t}`],
        e=document.getElementById(`${id}-${t}`),
        f=e.querySelector(".finish");
        e.querySelector(".progress div").style.width="100%"; e.querySelector(".progress").setAttribute("aria-valuenow", "100");
        f.style.display="block";
        f.querySelector(".sum").innerHTML=`Final score: <b>${s.score} / 10</b> (${s.score*10}%)`;
        let n=f.querySelector(".reviewnav");
        n.innerHTML=s.r.map((x, i)=>`<button data-i="${i}">${i+1}</button>`).join("");
        n.querySelectorAll("button").forEach(b=>b.onclick=()=>showReviewQuestion(id, t, +b.dataset.i));
        showReviewQuestion(id, t, 0)
      }
      function showReviewQuestion(id, t, i) {
        let s=exerciseStates[`${id}-${t}`],
        e=document.getElementById(`${id}-${t}`),
        r=s.r[i];
        e.querySelectorAll(".reviewnav button").forEach((b, j)=>b.classList.toggle("active", j===i));
        e.querySelector(".reviewbox").innerHTML=`<p><b>Question ${i+1}</b> ${r.ok?"✅":"❌"}</p><p><b>Prompt:</b> ${escapeHtml(r.q[r.qm])}</p><p><b>Your answer:</b> ${escapeHtml(r.u||"(blank)")}</p><p>${feedbackMarkup(r.q)}</p>`
      }
      renderApp();

      document.querySelectorAll("details.section").forEach(details => {
        const summary = details.querySelector(":scope > summary");
        if (!summary) return;
        const sync = () => summary.setAttribute("aria-expanded", String(details.open));
        sync();
        details.addEventListener("toggle", sync);
      });
  </script>

  <script>
    (() => {
      const STORAGE_KEY = "koreanQuizThemeV2";
      const ANCHOR_KEY = `koreanStudyAnchor:${location.pathname}`;
      const root = document.documentElement;
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const toggles = [...document.querySelectorAll("[data-theme-toggle]")];

      function savedTheme() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (_) { return null; }
      }

      function applyTheme(theme, persist = false) {
        const next = theme === "dark" ? "dark" : "light";
        root.dataset.theme = next;
        root.style.colorScheme = next;
        if (persist) {
          try { localStorage.setItem(STORAGE_KEY, next); } catch (_) {}
        }
        toggles.forEach(toggle => {
          const dark = next === "dark";
          toggle.setAttribute("aria-pressed", String(dark));
          toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
          toggle.title = dark ? "Switch to light mode" : "Switch to dark mode";
          const icon = toggle.querySelector("[data-theme-icon]");
          if (icon) icon.textContent = dark ? "☀" : "☾";
        });
      }

      applyTheme(savedTheme() || (media.matches ? "dark" : "light"));

      toggles.forEach(toggle => {
        toggle.addEventListener("click", () => {
          applyTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
        });
      });

      media.addEventListener?.("change", event => {
        if (!savedTheme()) applyTheme(event.matches ? "dark" : "light");
      });

      function storeAnchor(hash) {
        try {
          if (hash && hash !== "#top") localStorage.setItem(ANCHOR_KEY, hash);
          else localStorage.removeItem(ANCHOR_KEY);
        } catch (_) {}
      }

      document.addEventListener("click", event => {
        const link = event.target.closest('a[href^="#"]');
        if (link) storeAnchor(link.getAttribute("href"));
      });

      window.addEventListener("hashchange", () => storeAnchor(location.hash));

      if (!location.hash) {
        let saved = "";
        try { saved = localStorage.getItem(ANCHOR_KEY) || ""; } catch (_) {}
        if (saved && document.querySelector(saved)) {
          requestAnimationFrame(() => document.querySelector(saved)?.scrollIntoView());
        } else {
          requestAnimationFrame(() => window.scrollTo(0, 0));
        }
      }
    })();
  </script>


<script>
(() => {
  const RULE_DETAILS = {
    g1:["N + 은/는 (은 after a consonant, 는 after a vowel).","Frames the sentence topic or contrasts it with another topic."],
    g2:["N + 이/가 (이 after a consonant, 가 after a vowel).","Highlights or identifies the grammatical subject, often as new information."],
    g3:["N + 을/를 (을 after a consonant, 를 after a vowel).","Marks the noun directly affected by an action verb."],
    g4:["Time/place/destination noun + 에.","Marks a destination, a static location, or a specific time; it does not mark the place of an action."],
    g5:["Place noun + 에서.","Marks where an action occurs or the place from which movement begins."],
    g6:["N + 이에요/예요; formal N + 입니다.","Copular endings attach directly to nouns; 예요 follows a vowel and 이에요 follows a consonant."],
    g7:["N이/가 있다/없다.","Expresses existence, location, availability, or possession depending on context."],
    g8:["안 + verb/adjective.","Neutral short negation; it usually means the speaker does not do something by choice or habit."],
    g9:["못 + action verb.","Expresses inability caused by skill, circumstances, or external limits."],
    g10:["Verb/adjective stem + -아/어/해요.","The standard polite-casual present ending used in everyday conversation."],
    g11:["Verb/adjective stem + -았/었/했어요.","Marks a past action, completed event, or past state."],
    g12:["Verb stem + -(으)ㄹ 거예요.","Expresses a plan, intention, expectation, or prediction."],
    g13:["Verb stem + -(으)세요.","A polite everyday request or instruction; it can also honor the subject in context."],
    g14:["Verb stem + -(으)십시오.","A formal directive common in notices, announcements, tests, and official instructions."],
    g15:["Verb stem + -(으)ㅂ시다.","A formal or neutral suggestion meaning ‘let us’; avoid it toward a superior."],
    g16:["Verb stem + -(으)ㄹ까요?","Invites the listener’s opinion, proposes a joint action, or offers to do something."],
    g17:["Clause/verb stem + -고 + clause.","Links equal actions or descriptions without necessarily showing cause."],
    g18:["Stem + -아서/어서/해서 + clause.","Shows a reason or a natural sequence; commands and suggestions are usually avoided after causal -아서/어서."],
    g19:["Stem + -지만 + contrasting clause.","Introduces a contrast while acknowledging the first statement."],
    g20:["Stem + -(으)면 + result clause.","Expresses a condition or a repeated ‘when’ relationship."],
    g21:["Verb stem + -(으)려고 하다.","Shows an intention, plan, or action that is about to begin."],
    g22:["Verb stem + -고 싶다.","Expresses the speaker’s own desire; third-person desire normally uses -고 싶어하다."],
    g23:["Verb stem + -(으)러 + 가다/오다.","States the purpose of movement and is used with movement verbs such as 가다 or 오다."],
    g24:["Verb stem + -아/어 보다.","Means to try an action or to have experienced it."],
    g25:["Verb stem + -아/어도 되다.","Asks for or grants permission; literally says that doing the action is acceptable."],
    g26:["Verb stem + -(으)면 안 되다.","Expresses prohibition or strong advice not to do something."],
    g27:["Past modifier -(으)ㄴ + 후에.","The first action is completed before the second action begins."],
    g28:["Verb stem + -기 전에.","The following action happens before the action nominalized with -기."],
    g29:["Verb stem + -(으)ㄹ 수 있다/없다.","Expresses ability or possibility rather than permission."],
    g30:["Stem + -네요.","A soft spontaneous reaction to newly noticed information."],
    g31:["Stem + -군요/-는군요 or -네요.","Both show discovery; -군요 is more explicit or emphatic, while -네요 is softer and conversational."],
    g32:["Verb: -는 것 같다; adjective: -(으)ㄴ 것 같다; noun: 인 것 같다.","Softens a guess, impression, or uncertain opinion rather than stating it as a fact."]
  };

  function uniqueExamples(id, fallback) {
    const results = [];
    const seen = new Set();
    for (let attempts = 0; attempts < 30 && results.length < 3; attempts += 1) {
      let q;

  }

  });

  const liveTimers = new Map();
  const liveSelectors = [".status", ".progress", ".prompt-label", ".prompt", ".zone", ".feedback", ".next", ".runtime-bar"];
  function formatTime(seconds) { const safe = Math.max(0, Math.ceil(seconds)); return `${Math.floor(safe/60)}:${String(safe%60).padStart(2,"0")}`; }
  function clearTimer(key) { const timer = liveTimers.get(key); if (timer) clearInterval(timer); liveTimers.delete(key); }
  function setLive(element, visible) { liveSelectors.forEach(selector => element.querySelectorAll(selector).forEach(node => { if (node.classList.contains("feedback") || node.classList.contains("next")) return; node.classList.toggle("hidden", !visible); })); }
  function showSetup(id, type) {
    const key = `${id}-${type}`; clearTimer(key); const element = document.getElementById(key); exerciseStates[key].finished = false;
    element.querySelector(".exercise-menu").classList.remove("hidden"); element.querySelector(".exercise-toolbar").classList.add("hidden"); element.querySelector(".controls").classList.add("hidden"); element.querySelector(".finish").style.display = "none"; setLive(element, false);
  }
  function startExercise(id, type) {

    const count = Math.max(1, Math.min(100, Math.round(Number(element.querySelector(".menu-count").value) || 10))); element.querySelector(".menu-count").value = String(count);
    clearTimer(key); state.i = 0; state.score = 0; state.r = []; state.qm = element.querySelector(".menu-question").value; state.am = element.querySelector(".menu-answer").value; state.qs = Array.from({length: count}, () => generateQuestion(id)); state.done = false; state.finished = false;
    element.querySelector(".question-mode").value = state.qm; element.querySelector(".answer-mode").value = state.am; element.querySelector(".exercise-menu").classList.add("hidden"); element.querySelector(".finish").style.display = "none"; setLive(element, true); showQuestion(id, type);
    const minutes = Math.max(0, Number(element.querySelector(".menu-timer").value) || 0), label = element.querySelector(".runtime-timer");
    if (!minutes) { label.textContent = "Untimed"; return; }
    const deadline = Date.now() + minutes * 60000; const tick = () => { const remaining = (deadline - Date.now())/1000; label.textContent = `Time left: ${formatTime(remaining)}`; if (remaining <= 0) finishExercise(id, type, "Time is up"); }; tick(); liveTimers.set(key, setInterval(tick, 250));
  }

  showQuestion = function(id, type) {
    const state = exerciseStates[`${id}-${type}`], element = document.getElementById(`${id}-${type}`); if (state.finished || !state.qs.length) return; const q = state.qs[state.i]; state.done = false;
    element.querySelector(".count").textContent = `Question ${state.i + 1} / ${state.qs.length}`; element.querySelector(".score").textContent = `Score: ${state.score}`;
    const percent = (state.i/state.qs.length)*100; element.querySelector(".progress div").style.width = `${percent}%`; element.querySelector(".progress").setAttribute("aria-valuenow", String(Math.round(percent)));
    element.querySelector(".prompt-label").textContent = state.qm; element.querySelector(".prompt").textContent = q[state.qm]; element.querySelector(".feedback").className = "feedback"; element.querySelector(".feedback").innerHTML = ""; element.querySelector(".next").classList.add("hidden");
    const zone = element.querySelector(".zone");
    if (type === "typed") {
      zone.innerHTML = `<div class="answer-row"><label class="sr-only" for="${id}-${type}-answer">Your answer</label><input id="${id}-${type}-answer" class="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer"><button class="btn primary" type="button">Check</button></div>`;
      const input = zone.querySelector("input"), submit = () => submitAnswer(id, type, input.value); zone.querySelector("button").onclick = submit;
      input.onkeydown = event => { if (event.key !== "Enter") return; event.preventDefault(); if (state.done) element.querySelector(".next").click(); else submit(); };
      requestAnimationFrame(() => input.focus({preventScroll:true}));
    } else {
      let opts = [q, ...Array.from({length:5}, () => generateQuestion(id))].sort(() => Math.random()-.5).slice(0,4); if (!opts.includes(q)) opts[0] = q;
      zone.innerHTML = `<div class="choices">${opts.map((o,i) => `<button class="choice" type="button" data-i="${i}">${escapeHtml(o[state.am])}</button>`).join("")}</div>`;
      zone.querySelectorAll(".choice").forEach((button,index) => button.onclick = () => { const ok = normalizeAnswer(opts[index][state.am],state.am) === normalizeAnswer(q[state.am],state.am); zone.querySelectorAll(".choice").forEach((other,j) => { other.disabled = true; if (normalizeAnswer(opts[j][state.am],state.am) === normalizeAnswer(q[state.am],state.am)) other.classList.add("correct"); }); if (!ok) button.classList.add("wrong"); completeQuestion(id,type,opts[index][state.am],ok); });
    }
  };

  completeQuestion = function(id,type,userAnswer,correct) {
    const state = exerciseStates[`${id}-${type}`], element = document.getElementById(`${id}-${type}`), q = state.qs[state.i]; if (state.done || state.finished) return; state.done = true; if (correct) state.score += 1; state.r.push({q,u:userAnswer,ok:correct,qm:state.qm,am:state.am}); element.querySelector(".score").textContent = `Score: ${state.score}`;
    const feedback = element.querySelector(".feedback"); feedback.className = `feedback ${correct?"good":"bad"}`; feedback.innerHTML = `${correct?"Correct.":"Not quite."}<br>${feedbackMarkup(q)}`;
    const next = element.querySelector(".next"); next.textContent = state.i === state.qs.length-1 ? "Finish" : "Next"; next.classList.remove("hidden");
    if (type === "typed") { const input = element.querySelector(".ans"); if (input) { input.readOnly = true; requestAnimationFrame(() => input.focus({preventScroll:true})); } }
  };

  finishExercise = function(id,type,reason="Completed") {
    const key = `${id}-${type}`, state = exerciseStates[key]; if (state.finished) return; state.finished = true; clearTimer(key); const element = document.getElementById(key), finish = element.querySelector(".finish"), answered = state.r.length, percent = answered ? Math.round((state.score/answered)*100) : 0;
    element.querySelector(".progress div").style.width = `${state.qs.length ? (answered/state.qs.length)*100 : 0}%`; element.querySelector(".next").classList.add("hidden"); finish.style.display = "block"; finish.querySelector("h4").textContent = reason === "Completed" ? "Exercise complete" : reason; finish.querySelector(".sum").innerHTML = answered ? `Score: <b>${state.score} / ${answered}</b> (${percent}%) · ${answered} of ${state.qs.length} questions answered.` : "No questions were answered.";
    const nav = finish.querySelector(".reviewnav"); nav.innerHTML = state.r.map((result,index) => `<button type="button" data-i="${index}">${index+1}</button>`).join(""); nav.querySelectorAll("button").forEach(button => button.onclick = () => showReviewQuestion(id,type,Number(button.dataset.i))); if (answered) showReviewQuestion(id,type,0); else finish.querySelector(".reviewbox").innerHTML = ""; finish.scrollIntoView({behavior:"smooth",block:"nearest"});
  };

  document.querySelectorAll(".exercise").forEach(element => {
    const match = element.id.match(/^(g\d+)-(typed|mc)$/); if (!match) return; const [,id,type] = match, body = element.querySelector(".exercise-body");
    const menu = document.createElement("div"); menu.className = "exercise-menu"; menu.innerHTML = `<h4>Exercise setup</h4><p>Choose how many questions to answer, both languages, and an optional time limit.</p><div class="exercise-menu-grid"><label>Questions<input class="menu-count" type="number" min="1" max="100" value="10"></label><label>Timer in minutes<input class="menu-timer" type="number" min="0" step="0.5" value="0" placeholder="0 = untimed"></label><label>Question language<select class="menu-question"><option value="english">English</option><option value="romanization">Romanization</option><option value="korean">Korean</option></select></label><label>Answer language<select class="menu-answer"><option value="english">English</option><option value="romanization">Romanization</option><option value="korean" selected>Korean</option></select></label></div><div class="exercise-menu-actions"><button class="btn primary start-exercise" type="button">Start exercise</button></div>`; body.insertBefore(menu,body.firstChild);
    const runtime = document.createElement("div"); runtime.className = "runtime-bar"; runtime.innerHTML = `<span class="runtime-timer">Untimed</span><button class="end-early-btn" type="button">End exercise early</button>`; body.insertBefore(runtime,body.querySelector(".status"));
    menu.querySelector(".start-exercise").onclick = () => startExercise(id,type); runtime.querySelector(".end-early-btn").onclick = () => finishExercise(id,type,"Exercise ended early");
    element.querySelector(".next").onclick = () => { const state = exerciseStates[`${id}-${type}`]; if (state.i < state.qs.length-1) { state.i += 1; showQuestion(id,type); } else finishExercise(id,type); };
    element.querySelectorAll(".restart").forEach(button => button.onclick = () => showSetup(id,type)); showSetup(id,type);
  });
})();
</script>
