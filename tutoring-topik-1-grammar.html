  <style>

    html{scroll-behavior:smooth}

<script>
const points = [
['은/는','Topic particle','저는 학생이에요.','jeo-neun hak-ssaeng-i-e-yo','I am a student.','저__ 학생이에요.','jeo-__ hak-ssaeng-i-e-yo','I __ a student.','는','neun','topic marker after a vowel',['는','은','가','를']],
['이/가','Subject particle','누가 왔어요?','nu-ga wa-sseo-yo','Who came?','누__ 왔어요?','nu-__ wa-sseo-yo','Who __ came?','가','ga','subject marker after a vowel',['가','는','를','에']],
['을/를','Object particle','커피를 마셔요.','keo-pi-reul ma-syeo-yo','I drink coffee.','커피__ 마셔요.','keo-pi-__ ma-syeo-yo','I drink __ coffee.','를','reul','object marker after a vowel',['를','가','는','에서']],
['에','Place / destination / time','집에 있어요.','ji-be i-sseo-yo','I am at home.','집__ 있어요.','jip-__ i-sseo-yo','I am __ home.','에','e','location particle',['에','에서','를','는']],
['에서','Place of action','카페에서 커피를 마셔요.','ka-pe-e-seo keo-pi-reul ma-syeo-yo','I drink coffee at a café.','카페__ 커피를 마셔요.','ka-pe-__ keo-pi-reul ma-syeo-yo','I drink coffee __ a café.','에서','e-seo','place of action',['에서','에','이','을']],
['이다','To be (noun)','학생이에요.','hak-ssaeng-i-e-yo','I am a student.','학생___.','hak-ssaeng-___.','I ___ a student.','이에요','i-e-yo','polite noun ending after consonant',['이에요','예요','있어요','좋아요']],
['있다 / 없다','Existence / possession','책이 있어요.','chae-gi i-sseo-yo','There is a book.','책이 ___.','chae-gi ___.','There ___ a book.','있어요','i-sseo-yo','there is / have',['있어요','없어요','이에요','가요']],
['안 + V/A','Short negation','안 먹어요.','an meo-geo-yo','I do not eat.','__ 먹어요.','__ meo-geo-yo','I __ eat.','안','an','not (choice)',['안','못','없','아니']],
['못 + V','Inability','매운 음식을 못 먹어요.','mae-un eum-shi-geul mot meo-geo-yo','I cannot eat spicy food.','매운 음식을 __ 먹어요.','mae-un eum-shi-geul __ meo-geo-yo','I __ eat spicy food.','못','mot','cannot (inability)',['못','안','없','아니']],
['-아/어/해요','Present tense','공부해요.','gong-bu-hae-yo','I study.','공부하다 → ___','gong-bu-ha-da → ___','to study → ___','공부해요','gong-bu-hae-yo','polite present',['공부해요','공부했어요','공부할 거예요','공부하세요']],
['-았/었/했어요','Past tense','어제 갔어요.','eo-je ga-sseo-yo','I went yesterday.','가다 → ___','ga-da → ___','to go → ___','갔어요','ga-sseo-yo','polite past',['갔어요','가요','갈 거예요','가세요']],
['-(으)ㄹ 거예요','Future tense','내일 공부할 거예요.','nae-il gong-bu-hal geo-ye-yo','I will study tomorrow.','공부하다 → ___','gong-bu-ha-da → ___','to study → ___','공부할 거예요','gong-bu-hal geo-ye-yo','polite future',['공부할 거예요','공부해요','공부했어요','공부하고 싶어요']],
['-(으)세요','Polite request','읽으세요.','il-geu-se-yo','Please read.','읽다 → ___','ik-tta → ___','to read → ___','읽으세요','il-geu-se-yo','polite request',['읽으세요','읽어요','읽었어요','읽읍시다']],
['-(으)십시오','Formal command','기다리십시오.','gi-da-ri-ship-ssi-o','Please wait.','기다리다 → ___','gi-da-ri-da → ___','to wait → ___','기다리십시오','gi-da-ri-ship-ssi-o','formal command',['기다리십시오','기다리세요','기다려요','기다립시다']],
['-(으)ㅂ시다','Let’s','먹읍시다.','meo-geup-ssi-da','Let’s eat.','먹다 → ___','meok-tta → ___','to eat → ___','먹읍시다','meo-geup-ssi-da','formal-ish let’s',['먹읍시다','먹으세요','먹을까요','먹어요']],
['-(으)ㄹ까요?','Shall we?','점심 먹을까요?','jeom-shim meo-geul-kka-yo','Shall we have lunch?','먹다 → ___?','meok-tta → ___?','to eat → ___?','먹을까요','meo-geul-kka-yo','soft suggestion',['먹을까요','먹읍시다','먹으세요','먹어요']],
['-고','And / then','공부하고 자요.','gong-bu-ha-go ja-yo','I study and then sleep.','공부하다 + 자다 → 공부하__ 자요.','gong-bu-ha-da + ja-da → gong-bu-ha-__ ja-yo','study + sleep → study __ sleep.','고','go','connector: and/then',['고','지만','면','서']],
['-아서/어서','Because / then','피곤해서 쉬어요.','pi-gon-hae-seo swi-eo-yo','I am tired, so I rest.','피곤하다 → 피곤__ 쉬어요.','pi-gon-ha-da → pi-gon-__ swi-eo-yo','tired → tired, __ I rest.','해서','hae-seo','because / natural sequence',['해서','하고','하지만','하면']],
['-지만','But / although','어렵지만 재미있어요.','eo-ryeop-ji-man jae-mi-i-sseo-yo','It is difficult but interesting.','어렵다 → 어렵__ 재미있어요.','eo-ryeop-tta → eo-ryeop-__ jae-mi-i-sseo-yo','difficult → difficult __ interesting.','지만','ji-man','contrast connector',['지만','고','면','어서']],
['-(으)면','If / when','비가 오면 집에 있어요.','bi-ga o-myeon ji-be i-sseo-yo','If it rains, I stay home.','오다 → 오__','o-da → o-__','to come/rain → if it ___','면','myeon','if/when after vowel',['면','으면','지만','고']],
['-(으)려고 하다','Intention / plan','책을 사려고 해요.','chae-geul sa-ryeo-go hae-yo','I plan to buy a book.','사다 → 사__ 해요.','sa-da → sa-__ hae-yo','to buy → plan to buy','려고','ryeo-go','plan/intention after vowel',['려고','으려고','고 싶어','러']],

['-(으)러 가다/오다','Purpose of movement','친구를 만나러 왔어요.','chin-gu-reul man-na-reo wa-sseo-yo','I came to meet a friend.','만나다 → 만나__ 왔어요.','man-na-da → man-na-__ wa-sseo-yo','to meet → came in order to meet','러','reo','purpose before movement verb',['러','려고','고','면']],
['-아/어 보다','Try / experience','읽어 보세요.','il-geo bo-se-yo','Please try reading it.','읽다 → 읽__ 보세요.','ik-tta → il-__ bo-se-yo','to read → try reading','어','eo','try doing',['어','고','면','지만']],
['-아/어도 되다','Permission','사진 찍어도 돼요?','sa-jin jji-geo-do dwae-yo','May I take a photo?','찍다 → 찍__ 돼요?','jjik-tta → jji-__ dwae-yo','to take → may I take?','어도','eo-do','permission ending',['어도','으면','지만','고']],
['-(으)면 안 되다','Prohibition','여기서 담배를 피우면 안 돼요.','yeo-gi-seo dam-bae-reul pi-u-myeon an dwae-yo','You must not smoke here.','피우다 → 피우__ 안 돼요.','pi-u-da → pi-u-__ an dwae-yo','to smoke → must not smoke','면','myeon','prohibition condition',['면','어도','고','지만']],
['-(으)ㄴ 후에','After','밥을 먹은 후에 공부해요.','ba-beul meo-geun hu-e gong-bu-hae-yo','I study after eating.','먹다 → 먹__ 후에','meok-tta → meo-__ hu-e','to eat → after eating','은','eun','past modifier after consonant',['은','는','을','이']],
['-기 전에','Before','자기 전에 책을 읽어요.','ja-gi jeo-ne chae-geul il-geo-yo','I read a book before sleeping.','자다 → 자__ 전에','ja-da → ja-__ jeo-ne','to sleep → before sleeping','기','gi','nominalizer before 전에',['기','고','면','러']],
['-(으)ㄹ 수 있다/없다','Can / cannot','한국어를 읽을 수 있어요.','han-gu-geo-reul il-geul su i-sseo-yo','I can read Korean.','읽다 → 읽__ 수 있어요.','ik-tta → il-__ su i-sseo-yo','to read → can read','을','eul','ability ending after consonant',['을','는','은','이']],
['-네요','Realization','사람이 많네요.','sa-ra-mi man-ne-yo','Oh, there are many people.','많다 → 많__','man-ta → man-__','many → oh, it is many','네요','ne-yo','soft realization',['네요','군요','어요','지만']],

];

const state={correct:0,answered:0,done:{}};
const langs={en:'English',ro:'Romanization',ko:'Korean'};
function qText(p,kind,lang){
  if(kind==='type') return lang==='ko'?p[5]:lang==='ro'?p[6]:p[7];
  return lang==='ko'?p[2]:lang==='ro'?p[3]:p[4];
}
function ansText(p,lang){return lang==='ko'?p[8]:lang==='ro'?p[9]:p[10]}
function sentence(p,lang){return lang==='ko'?p[2]:lang==='ro'?p[3]:p[4]}
function normalize(v,lang){
  let s=v.trim().toLowerCase().replace(/[.?!]/g,'');
  if(lang==='ro') s=s.replace(/\s+/g,'-').replace(/-+/g,'-');
  else s=s.replace(/\s+/g,' ');
  return s;
}
function render(){
  const content=document.getElementById('content'),toc=document.getElementById('toc'),bank=document.getElementById('bank');
  content.innerHTML='';toc.innerHTML='';bank.innerHTML='';
  points.forEach((p,i)=>{
    const id='g'+(i+1);
    toc.insertAdjacentHTML('beforeend',`<a href="#${id}">G${i+1}. ${p[0]}</a>`);
    bank.insertAdjacentHTML('beforeend',`<a href="#${id}" title="${p[1]}">${p[0]}</a>`);
    const sec=document.createElement('article');sec.className='section-card';sec.id=id;
    sec.innerHTML=`
      <div class="section-head">
        <div class="section-title"><div class="number">${i+1}</div><div><h2>${p[0]}</h2><p>${p[1]}</p></div></div>
        <button class="collapse" aria-expanded="true"><i data-lucide="chevron-up"></i> Collapse</button>
      </div>
      <div class="section-body">
        <div class="exercise-grid">
          <div class="exercise">
            <span class="tag">Typing</span><h3>Produce the exact answer</h3>
            <p class="prompt type-prompt"></p>
            <div class="input-row"><input type="text" class="type-input" autocomplete="off" spellcheck="false" placeholder="Type your answer"><button class="btn btn-primary check-type">Check</button></div>
            <p class="note">In romanization mode, pressing Space inserts a dash. Spelling is strict.</p>
            <div class="feedback type-feedback">Answer feedback will appear here.</div>
          </div>
          <div class="exercise">
            <span class="tag" style="background:var(--secondary);color:#052e2b">Multiple choice</span><h3>Select the correct answer</h3>
            <p class="prompt mc-prompt"></p>
            <div class="options"></div>
            <div class="feedback mc-feedback">Answer feedback will appear here.</div>
          </div>
        </div>
        <div class="restart-row"><button class="restart"><i data-lucide="rotate-ccw"></i> Restart section</button></div>
      </div>`;
    content.appendChild(sec);
    bindSection(sec,p,i);
  });
  lucide.createIcons();
}
function bindSection(sec,p,i){
  const ql=document.getElementById('questionLang').value,al=document.getElementById('answerLang').value;
  sec.querySelector('.type-prompt').textContent=qText(p,'type',ql);
  sec.querySelector('.mc-prompt').textContent=qText(p,'mc',ql);
  const opts=sec.querySelector('.options');
  const choices=p[11].map(x=>({ko:x,ro:romanizeChoice(p,x),en:englishChoice(p,x)}));
  choices.forEach((c,idx)=>{const b=document.createElement('button');b.className='option';b.textContent=c[al];b.dataset.correct=idx===0?'1':'0';b.addEventListener('click',()=>checkMC(sec,p,i,b));opts.appendChild(b)});
  const inp=sec.querySelector('.type-input');
  inp.addEventListener('keydown',e=>{if(e.key===' '&&document.getElementById('answerLang').value==='ro'){e.preventDefault();const s=inp.selectionStart;inp.value=inp.value.slice(0,s)+'-'+inp.value.slice(inp.selectionEnd);inp.selectionStart=inp.selectionEnd=s+1}if(e.key==='Enter')checkType(sec,p,i)});
  sec.querySelector('.check-type').addEventListener('click',()=>checkType(sec,p,i));
  sec.querySelector('.restart').addEventListener('click',()=>restartSection(sec,i));
  sec.querySelector('.collapse').addEventListener('click',e=>{const body=sec.querySelector('.section-body');body.classList.toggle('hidden');const open=!body.classList.contains('hidden');e.currentTarget.setAttribute('aria-expanded',open);e.currentTarget.innerHTML=`<i data-lucide="chevron-${open?'up':'down'}"></i> ${open?'Collapse':'Expand'}`;lucide.createIcons()});
}
function romanizeChoice(p,x){if(x===p[8])return p[9];const map={'은':'eun','는':'neun','이':'i','가':'ga','을':'eul','를':'reul','에':'e','에서':'e-seo','안':'an','못':'mot','고':'go','지만':'ji-man','면':'myeon','으면':'eu-myeon','러':'reo','려고':'ryeo-go','으려고':'eu-ryeo-go','어':'eo','어도':'eo-do','은':'eun','기':'gi','네요':'ne-yo','군요':'gun-yo','인':'in'};return map[x]||x}
function englishChoice(p,x){if(x===p[8])return p[10];const map={'은':'topic marker after consonant','는':'topic marker after vowel','이':'subject marker after consonant','가':'subject marker after vowel','을':'object/ending after consonant','를':'object marker after vowel','에':'at/to','에서':'at (action place)','안':'not','못':'cannot','고':'and/connector','지만':'but','면':'if/when','으면':'if/when after consonant','러':'purpose of movement','려고':'plan to','으려고':'plan to after consonant','어':'connector','어도':'even if / permission','기':'verb nominalizer','네요':'soft realization','군요':'formal discovery','인':'noun modifier'};return map[x]||x}
function feedbackHTML(p,correct){const selected=[...document.querySelectorAll('#questionLang,#answerLang')];const langsToShow=['en','ro','ko'];return `<strong>${correct?'Correct':'Not quite'}</strong>${langsToShow.map(l=>`<div class="lang-line"><b>${langs[l]}</b><span>${sentence(p,l)}</span></div>`).join('')}`}
function mark(key,ok){if(state.done[key])return;state.done[key]=true;state.answered++;if(ok)state.correct++;updateScore()}
function checkType(sec,p,i){const lang=document.getElementById('answerLang').value,inp=sec.querySelector('.type-input'),fb=sec.querySelector('.type-feedback');const ok=normalize(inp.value,lang)===normalize(ansText(p,lang),lang);fb.className='feedback type-feedback '+(ok?'good':'bad');fb.innerHTML=feedbackHTML(p,ok);inp.disabled=true;sec.querySelector('.check-type').disabled=true;mark(`t${i}`,ok)}
function checkMC(sec,p,i,btn){const ok=btn.dataset.correct==='1';sec.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.correct==='1')b.classList.add('correct')});if(!ok)btn.classList.add('wrong');const fb=sec.querySelector('.mc-feedback');fb.className='feedback mc-feedback '+(ok?'good':'bad');fb.innerHTML=feedbackHTML(p,ok);mark(`m${i}`,ok)}
function restartSection(sec,i){['t'+i,'m'+i].forEach(k=>{if(state.done[k]){state.answered--;if(sec.querySelector(k[0]==='t'?'.type-feedback':'.mc-feedback').classList.contains('good'))state.correct--;delete state.done[k]}});updateScore();const p=points[i];const body=sec.querySelector('.section-body');body.classList.remove('hidden');sec.querySelector('.type-input').disabled=false;sec.querySelector('.type-input').value='';sec.querySelector('.check-type').disabled=false;sec.querySelector('.type-feedback').className='feedback type-feedback';sec.querySelector('.type-feedback').textContent='Answer feedback will appear here.';sec.querySelector('.mc-feedback').className='feedback mc-feedback';sec.querySelector('.mc-feedback').textContent='Answer feedback will appear here.';const opts=sec.querySelector('.options');opts.innerHTML='';const al=document.getElementById('answerLang').value;p[11].forEach((x,idx)=>{const b=document.createElement('button');b.className='option';b.textContent=al==='ko'?x:al==='ro'?romanizeChoice(p,x):englishChoice(p,x);b.dataset.correct=idx===0?'1':'0';b.addEventListener('click',()=>checkMC(sec,p,i,b));opts.appendChild(b)})}
function updateScore(){document.getElementById('scoreCorrect').textContent=state.correct;document.getElementById('scoreAnswered').textContent=state.answered;document.getElementById('scorePct').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'0%'}
function refreshLanguages(){document.querySelectorAll('.section-card').forEach((sec,i)=>restartSection(sec,i));render();}
document.getElementById('questionLang').addEventListener('change',refreshLanguages);document.getElementById('answerLang').addEventListener('change',refreshLanguages);
const saved=localStorage.getItem('topik-theme');const prefers=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=saved||prefers;
document.getElementById('themeBtn').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('topik-theme',next)});
render();updateScore();
</script>
</body>
</html>
